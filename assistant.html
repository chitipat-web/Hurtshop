<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#00a4e4">
<title>ผู้ช่วย — HURT SHOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="hurt-logo.jpg">
<link rel="apple-touch-icon" href="hurt-logo.jpg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ผู้ช่วย HURT">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  input, select, textarea, button { font-family: inherit; }
  :root {
    --bg: #0b1620; --card: #15242f; --card2: #1d3340; --line: #2c4452;
    --text: #f1f5f9; --muted: #93acba; --green: #22c55e; --green-d: #16a34a;
    --blue: #00a4e4; --red: #ef4444; --accent: #4cc9f0; --amber: #f59e0b;
    --cyan: #00a4e4; --cyan-d: #0086c9;
    --glass:    rgba(255,255,255,.035);
    --glass-2:  rgba(255,255,255,.06);
    --glass-bd: rgba(255,255,255,.14);
    --glass-hi: rgba(255,255,255,.28);
    --blur:     saturate(180%) blur(22px);
    --glass-sh: 0 8px 30px rgba(0,0,0,.30);
    --inset-hi: inset 0 1px 0 var(--glass-hi), inset 0 0 0 .5px rgba(255,255,255,.05);
  }
  html, body { height: 100%; }
  body {
    font-family: 'IBM Plex Sans Thai', -apple-system, BlinkMacSystemFont, "Segoe UI", "Sukhumvit Set", "Helvetica Neue", sans-serif;
    color: var(--text);
    background:
      radial-gradient(1100px 620px at 82% -8%,  rgba(0,164,228,.22), transparent 60%),
      radial-gradient(820px 520px at -12% 18%,  rgba(0,164,228,.18), transparent 55%),
      var(--bg);
    background-attachment: fixed;
    display: flex; flex-direction: column;
    height: 100dvh;
    -webkit-text-size-adjust: 100%;
  }
  /* พื้นหลังมีชีวิต (ชุดเดียวกับหน้าหลัก) */
  .aurora { position: fixed; inset: -20%; z-index: -1; pointer-events: none; filter: blur(60px) saturate(140%); opacity: .45; }
  .aurora i { position: absolute; display: block; border-radius: 50%; mix-blend-mode: screen; }
  .aurora i:nth-child(1) { width: 55vmax; height: 55vmax; left: -12vmax; top: -14vmax; background: radial-gradient(circle at 30% 30%, rgba(0,164,228,.5), transparent 60%); animation: au1 26s ease-in-out infinite alternate; }
  .aurora i:nth-child(2) { width: 48vmax; height: 48vmax; right: -16vmax; top: 18vmax; background: radial-gradient(circle at 60% 40%, rgba(167,139,250,.28), transparent 62%); animation: au2 32s ease-in-out infinite alternate; }
  .aurora i:nth-child(3) { width: 60vmax; height: 60vmax; left: 16vmax; bottom: -24vmax; background: radial-gradient(circle at 50% 60%, rgba(0,106,163,.45), transparent 60%); animation: au3 38s ease-in-out infinite alternate; }
  @keyframes au1 { to { transform: translate(9vmax, 7vmax) scale(1.15); } }
  @keyframes au2 { to { transform: translate(-10vmax, 9vmax) scale(.92); } }
  @keyframes au3 { to { transform: translate(-7vmax, -9vmax) scale(1.12); } }

  header {
    position: relative; z-index: 5; flex-shrink: 0;
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(180deg, rgba(11,22,32,.88), rgba(11,22,32,.55));
    -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    border-bottom: 1px solid rgba(255,255,255,.07);
  }
  body.in-frame header { padding-right: 58px; }   /* เว้นที่ให้ปุ่มปิดของหน้าหลัก */
  body.in-frame header a.back { display: none; }
  header a.back {
    color: var(--text); text-decoration: none; width: 36px; height: 36px; border-radius: 12px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--glass-2); border: 1px solid var(--glass-bd); box-shadow: var(--inset-hi);
  }
  header a.back svg, .hbtn svg { width: 18px; height: 18px; }
  .hava { position: relative; width: 44px; height: 44px; flex-shrink: 0; }
  .hava img { width: 44px; height: 44px; border-radius: 14px; object-fit: cover; display: block; box-shadow: 0 0 0 2px rgba(76,201,240,.5), 0 6px 18px rgba(0,164,228,.4); }
  .hava .on { position: absolute; right: -3px; bottom: -3px; width: 14px; height: 14px; border-radius: 50%; background: #64748b; border: 3px solid #0b1620; transition: background .3s; }
  .hava .on.live { background: var(--green); box-shadow: 0 0 10px rgba(34,197,94,.9); }
  header .t { flex: 1; min-width: 0; }
  header .t h1 { font-size: 16.5px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
  header .t h1 .badge { font-size: 10.5px; font-weight: 600; color: #9fe6ff; background: rgba(0,164,228,.16); border: 1px solid rgba(0,164,228,.35); padding: 1px 8px; border-radius: 999px; }
  header .t p { font-size: 12px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hbtn { width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--glass-2); border: 1px solid var(--glass-bd); color: var(--muted); cursor: pointer; box-shadow: var(--inset-hi); transition: color .2s, transform .15s; }
  .hbtn:active { transform: scale(.92); }

  #chat { flex: 1; overflow-y: auto; padding: 18px 14px 12px; display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; }
  #chat::-webkit-scrollbar { width: 0; }

  /* หน้าต้อนรับ */
  .hero { text-align: center; padding: 10px 2px 2px; animation: pop .45s cubic-bezier(.22,1,.36,1); }
  .big-ava { width: 80px; height: 80px; margin: 6px auto 14px; position: relative; }
  .big-ava::before { content: ""; position: absolute; inset: -4px; border-radius: 50%; background: conic-gradient(from 0deg, #4cc9f0, #00a4e4, #a78bfa, #f472b6, #4cc9f0); animation: spin 5s linear infinite; }
  .big-ava::after { content: ""; position: absolute; inset: -1px; border-radius: 50%; background: #0b1620; }
  .big-ava img { position: relative; z-index: 1; width: 80px; height: 80px; border-radius: 50%; object-fit: cover; display: block; }
  .big-ava { filter: drop-shadow(0 8px 24px rgba(0,164,228,.45)); }
  .hero h2 { font-size: 21px; font-weight: 700; }
  .hero h2 span { background: linear-gradient(120deg, #f2fbff 20%, #7dd8f8 60%, #c4b5fd); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .hero > p { color: var(--muted); font-size: 13.5px; margin-top: 4px; }
  .stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0 6px; }
  .stats3 div { background: linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02)); border: 1px solid rgba(255,255,255,.12); border-radius: 16px; padding: 10px 6px; box-shadow: var(--inset-hi); }
  .stats3 span { display: block; font-size: 11px; color: var(--muted); }
  .stats3 b { font-size: 16px; font-variant-numeric: tabular-nums; }
  .stats3 b.hl { color: #7dd8f8; }
  .sugg-t { font-size: 12px; color: var(--muted); text-align: left; margin: 14px 2px 8px; letter-spacing: .3px; }
  .sugg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sugg button {
    display: flex; flex-direction: column; gap: 3px; align-items: flex-start; text-align: left;
    padding: 12px; border-radius: 16px; cursor: pointer; color: var(--text); font-size: 13.5px; font-weight: 600; line-height: 1.35;
    background: linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    border: 1px solid rgba(255,255,255,.12); box-shadow: var(--inset-hi);
    transition: transform .18s cubic-bezier(.34,1.45,.5,1), border-color .2s;
  }
  .sugg button .ic { font-size: 20px; margin-bottom: 2px; }
  .sugg button small { color: var(--muted); font-size: 11.5px; font-weight: 400; }
  .sugg button:active { transform: scale(.96); }
  @media (hover: hover) { .sugg button:hover { border-color: rgba(76,201,240,.55); transform: translateY(-2px); } }

  /* ข้อความ */
  .row { display: flex; gap: 8px; align-items: flex-start; animation: pop .25s ease-out; }
  .row.user { justify-content: flex-end; }
  .row > .ava { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex-shrink: 0; margin-top: 2px; box-shadow: 0 0 0 1.5px rgba(76,201,240,.5), 0 4px 10px rgba(0,164,228,.3); }
  .col { display: flex; flex-direction: column; gap: 4px; max-width: 86%; min-width: 0; }
  .row.user .col { align-items: flex-end; max-width: 80%; }
  .msg { padding: 11px 14px; border-radius: 20px; font-size: 14.5px; line-height: 1.6; word-break: break-word; }
  .msg.bot {
    background: linear-gradient(160deg, rgba(255,255,255,.075), rgba(255,255,255,.035));
    -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    border: 1px solid rgba(255,255,255,.12); border-bottom-left-radius: 6px;
    box-shadow: 0 8px 24px rgba(0,0,0,.25), var(--inset-hi);
  }
  .msg.user { background: linear-gradient(135deg, #2fc0f3, #0077b8); color: #fff; font-weight: 500; white-space: pre-line; border-bottom-right-radius: 6px; box-shadow: 0 6px 18px rgba(0,164,228,.35), inset 0 1px 0 rgba(255,255,255,.3); }
  .time { font-size: 10.5px; color: rgba(147,172,186,.75); padding: 0 6px; }
  .msg .lead { font-size: 15.5px; font-weight: 600; line-height: 1.5; }
  .msg .hint { display: inline-block; font-size: 12px; color: #fcd34d; background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.3); border-radius: 999px; padding: 2px 10px; margin-bottom: 6px; }
  .msg .ln { margin-top: 2px; }
  .msg .gap { height: 8px; }
  .msg b.amt { color: #7dd8f8; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .msg .lead b.amt { color: #9fe6ff; }
  .msg .bl { display: flex; gap: 9px; margin-top: 4px; }
  .msg .bl::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-top: .7em; flex-shrink: 0; box-shadow: 0 0 6px rgba(76,201,240,.7); }
  .msg .rk { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; border-top: 1px solid rgba(255,255,255,.06); }
  .msg .rk .n { width: 23px; height: 23px; border-radius: 8px; background: rgba(0,164,228,.16); color: #9fe6ff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
  .msg .rk.r1 .n { background: linear-gradient(135deg, #ffe38a, #cfa219); color: #3a2a00; }
  .msg .rk.r2 .n { background: linear-gradient(135deg, #f1f5f9, #94a3b8); color: #1e293b; }
  .msg .rk.r3 .n { background: linear-gradient(135deg, #fdba74, #b45309); color: #2a1300; }
  .msg .rec { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,.2); border: 1px solid rgba(255,255,255,.07); border-radius: 14px; padding: 8px 10px; margin-top: 6px; line-height: 1.35; }
  .msg .rec .ri { width: 30px; height: 30px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; background: rgba(255,255,255,.06); }
  .msg .rec .rt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .msg .rec .ra { font-size: 14px; font-weight: 600; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .msg .rec .ra em { font-style: normal; font-weight: 400; font-size: 11.5px; color: var(--muted); }
  .msg .rec .rt small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msg .rec .slipchip { flex-shrink: 0; }
  .msg .rk .rec { margin-top: 0; flex: 1; }
  .msg .note { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
  .slipchip { display: inline-flex; align-items: center; gap: 4px; background: rgba(0,164,228,.14); border: 1px solid rgba(76,201,240,.4); color: #9fe6ff; border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .typing { display: flex; gap: 5px; padding: 14px 16px; border-radius: 20px; border-bottom-left-radius: 6px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: bounce 1.1s infinite; }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .35; } 30% { transform: translateY(-5px); opacity: 1; } }
  .fchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; animation: pop .3s ease-out .1s backwards; }
  .fchips button { background: rgba(0,164,228,.1); border: 1px solid rgba(76,201,240,.35); color: #9fe6ff; border-radius: 999px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; font-family: inherit; transition: background .2s; }
  .fchips button::before { content: "↳ "; opacity: .6; }
  .fchips button:active { background: rgba(0,164,228,.25); }
  @keyframes pop { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* แถบคำถามลัด + ช่องพิมพ์ */
  #quick {
    display: flex; gap: 8px; padding: 8px 14px 4px; overflow-x: auto; flex-shrink: 0; -webkit-overflow-scrolling: touch;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 28px), transparent);
    mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 28px), transparent);
  }
  #quick::-webkit-scrollbar { display: none; }
  #quick button { flex-shrink: 0; display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.05); color: var(--text); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 7px 13px; font-size: 13px; white-space: nowrap; cursor: pointer; box-shadow: var(--inset-hi); }
  #quick button:active { background: rgba(0,164,228,.15); }
  #inputbar {
    display: flex; gap: 8px; align-items: center; flex-shrink: 0;
    padding: 8px 12px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(0deg, rgba(11,22,32,.95), rgba(11,22,32,.6));
    -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  }
  .inwrap { flex: 1; display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 4px 4px 4px 16px; transition: border-color .2s, box-shadow .2s; box-shadow: var(--inset-hi); }
  .inwrap:focus-within { border-color: rgba(76,201,240,.7); box-shadow: 0 0 0 4px rgba(0,164,228,.14); }
  #inputbar input { flex: 1; min-width: 0; background: none; border: none; outline: none; color: var(--text); font-size: 15.5px; padding: 8px 0; }
  #inputbar input::placeholder { color: rgba(147,172,186,.85); }
  #sendBtn { width: 40px; height: 40px; border-radius: 50%; border: none; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; cursor: pointer; background: linear-gradient(135deg, #4cc9f0, #0077b8); box-shadow: 0 4px 14px rgba(0,164,228,.5); transition: transform .15s, opacity .2s, box-shadow .2s; }
  #sendBtn:disabled { opacity: .35; box-shadow: none; cursor: default; }
  #sendBtn:not(:disabled):active { transform: scale(.9); }
  #sendBtn svg { width: 18px; height: 18px; }
  @media (prefers-reduced-motion: reduce) { .aurora i, .big-ava::before, .typing span { animation: none; } .row, .hero, .fchips { animation: none; } }
  /* login screen — เหมือน bank.html */
  #loginScreen {
    position: fixed; inset: 0; z-index: 150;
    background: var(--bg);
    background:
      radial-gradient(1100px 620px at 82% -8%,  rgba(0,164,228,.22), transparent 60%),
      radial-gradient(820px 520px at -12% 18%,  rgba(0,164,228,.18), transparent 55%),
      var(--bg);
    display: none; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  #loginScreen .card {
    background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    border: 1px solid var(--glass-bd); border-radius: 22px;
    box-shadow: var(--glass-sh), var(--inset-hi);
    padding: 34px 26px; max-width: 340px; width: 100%;
  }
  #loginScreen img { width: 74px; height: 74px; border-radius: 20px; margin-bottom: 14px; }
  #loginScreen h2 { font-size: 19px; margin-bottom: 6px; }
  #loginScreen p { color: var(--muted); font-size: 13.5px; white-space: pre-line; line-height: 1.6; margin-bottom: 20px; }
  #gBtn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; background: #fff; color: #1f2933;
    border: none; border-radius: 14px; padding: 13px;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  #loginSignout { display: none; margin-top: 14px; background: none; border: none; color: var(--accent); font-size: 13.5px; cursor: pointer; text-decoration: underline; }
  /* ปุ่มดูสลิปในแชท + ไลท์บ็อกซ์ */
  .slip-lightbox { position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,.88); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; padding: 20px; flex-direction: column; }
  .slip-lightbox.show { display: flex; }
  .slip-lightbox img { max-width: 100%; max-height: 82vh; border-radius: 14px; box-shadow: 0 12px 44px rgba(0,0,0,.7); }
  .slip-lb-msg { color: #cfeef7; font-size: 14px; margin-top: 14px; text-align: center; }
  .slip-lb-close { color: #cfeef7; font-size: 13px; margin-top: 16px; opacity: .8; }
  /* ripple ตอนแตะ */
  #quick button, #inputbar button, .slipchip, .sugg button, .fchips button, #gBtn { position: relative; overflow: hidden; }
  .rip { position: absolute; border-radius: 50%; transform: scale(0); background: rgba(255,255,255,.38); pointer-events: none; animation: rip .55s cubic-bezier(.25,.7,.35,1) forwards; z-index: 3; }
  #gBtn .rip { background: rgba(0,0,0,.13); }
  #inputbar button .rip { background: rgba(4,40,58,.28); }
  @keyframes rip { to { transform: scale(2.5); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .rip { display: none; } }
</style>
</head>
<body>

<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<header>
  <a class="back" href="./" aria-label="กลับ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
  <div class="hava"><img src="hurt-logo.jpg" alt=""><span class="on" id="syncDot"></span></div>
  <div class="t">
    <h1>น้องเฮิร์ต <span class="badge">ผู้ช่วยร้าน</span></h1>
    <p id="syncText">กำลังเชื่อมต่อ...</p>
  </div>
  <button class="hbtn" onclick="resetChat()" aria-label="เริ่มแชทใหม่" title="เริ่มแชทใหม่"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
</header>

<div id="chat"></div>
<div id="quick"></div>

<div id="inputbar">
  <div class="inwrap">
    <input id="input" type="text" placeholder="ถามน้องเฮิร์ตได้เลย..." autocomplete="off" enterkeyhint="send"
           onkeydown="if(event.key==='Enter' && !event.isComposing)send()" oninput="document.getElementById('sendBtn').disabled=!this.value.trim()">
    <button id="sendBtn" onclick="send()" aria-label="ส่ง" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg></button>
  </div>
</div>

<div id="loginScreen">
  <div class="card">
    <img src="hurt-logo.jpg" alt="HURT SHOP" onerror="this.style.display='none'">
    <h2>ผู้ช่วย HURT SHOP</h2>
    <p id="loginMsg">เข้าสู่ระบบเพื่อใช้งาน</p>
    <button id="gBtn" onclick="googleSignIn()">

const MONTHS = [

const WEEKDAYS = { 'อาทิตย์':0, 'จันทร์':1, 'อังคาร':2, 'พุธ':3, 'พฤหัสบดี':4, 'พฤหัส':4, 'ศุกร์':5, 'เสาร์':6 };
// หาช่วงเวลาทั้งหมดในประโยค (เรียงตามตำแหน่ง) — คืน periods + ข้อความที่ตัดส่วนวันที่ออกแล้ว
function parsePeriods(t){
  const today = todayStr(), now = new Date(), cy = now.getFullYear(), cm = now.getMonth() + 1, cd = now.getDate();
  const found = [];
  const add = (re, fn) => { let m; const g = new RegExp(re, 'g'); while((m = g.exec(t))){ const p = fn(m); if(p) found.push({ i: m.index, len: m[0].length, p: Object.assign(p, { raw: m[0] }) }); if(!m[0].length) g.lastIndex++; } };
  const monthAlt = MONTHS.map(x => x[1]).join('|'), monthShort = MONTHS.map(x => x[2]).join('|');
  const YEAR = '(25\\d\\d|20[1-4]\\d|[6-9]\\d)(?!\\d)';
  const monthNo = s => { for(const [n, full, short] of MONTHS){ if(new RegExp('^(?:' + full + '|' + short + ')$').test(s)) return n; } return 0; };
  const guessYear = (m, d) => (m > cm || (m === cm && d && d > cd)) ? cy - 1 : cy;   // เดือน/วันที่ยังมาไม่ถึง = ของปีที่แล้ว
  // วันที่ + เดือน (+ปี): "5 ต.ค." "วันที่ 5 ตุลา 69"
  add('(?:วันที่\\s*)?(\\d{1,2})\\s*((?:' + monthAlt + ')|(?:' + monthShort + ')(?![ก-๙]))\\s*(?:(?:พ\\.ศ\\.|ปี)\\s*)?(?:' + YEAR + ')?', m => {
    const mo = monthNo(m[2]), d = Number(m[1]); if(!mo || d < 1 || d > 31) return null;
    const y = yearFrom(m[3]) || guessYear(mo, d);
    const s = dateOf(y, mo, d); return dayPeriod(s);
  });
  // เดือน (+ปี): "ตุลา" "ต.ค. 69" "เดือนกันยา" "เดือน ตค"
  add('(?:เดือน\\s*)?(' + monthAlt + ')\\s*(?:(?:พ\\.ศ\\.|ปี)\\s*)?(?:' + YEAR + ')?', m => {
    const mo = monthNo(m[1]); if(!mo) return null;
    const y = yearFrom(m[2]) || guessYear(mo); return monthPeriod(y, mo);
  });
  add('เดือน\\s*(' + monthShort + ')(?![ก-๙])', m => { const mo = monthNo(m[1]); return mo ? monthPeriod(guessYear(mo), mo) : null; });
  add('(\\d{1,2})\\s*/\\s*(\\d{1,2})(?:\\s*/\\s*' + YEAR + ')?', m => {
    const d = Number(m[1]), mo = Number(m[2]); if(d < 1 || d > 31 || mo < 1 || mo > 12) return null;
    return dayPeriod(dateOf(yearFrom(m[3]) || guessYear(mo, d), mo, d));
  });
  add('(\\d{4})-(\\d{1,2})-(\\d{1,2})', m => dayPeriod(dateOf(Number(m[1]), Number(m[2]), Number(m[3]))));
  add('วันที่\\s*(\\d{1,2})(?!\\s*[/\\d])', m => {
    const d = Number(m[1]); if(d < 1 || d > 31) return null;
    return d > cd ? dayPeriod(dateOf(cy, cm - 1, d)) : dayPeriod(dateOf(cy, cm, d));
  });
  add('เมื่อวานซืน', () => dayPeriod(daysAgoStr(2), 'เมื่อวานซืน (' + thaiDate(daysAgoStr(2)) + ')'));
  add('เมื่อวาน(?!ซืน)', () => dayPeriod(daysAgoStr(1), 'เมื่อวาน (' + thaiDate(daysAgoStr(1)) + ')'));
  add('วันนี้', () => dayPeriod(today, 'วันนี้ (' + thaiDate(today) + ')'));
  add('(\\d{1,3})\\s*วัน\\s*(?:ก่อน|ที่แล้ว)', m => { const n = Number(m[1]); return dayPeriod(daysAgoStr(n), n + ' วันก่อน (' + thaiDate(daysAgoStr(n)) + ')'); });
  add('(?:ย้อนหลัง\\s*)?(\\d{1,3})\\s*วัน(?:\\s*(?:ล่าสุด|หลังสุด|ย้อนหลัง|ที่ผ่านมา))?(?!\\s*(?:ก่อน|ที่แล้ว))', m => {
    const n = Number(m[1]); if(n < 1) return null;
    return { from: daysAgoStr(n - 1), to: today, label: n + ' วันล่าสุด', kind: 'days', n };
  });
  add('วัน\\s*(อาทิตย์|จันทร์|อังคาร|พุธ|พฤหัสบดี|พฤหัส|ศุกร์|เสาร์)(\\s*(?:ที่แล้ว|ก่อน))?', m => {
    let back = (now.getDay() - WEEKDAYS[m[1]] + 7) % 7; if(m[2]) back += 7;
    return dayPeriod(daysAgoStr(back), 'วัน' + m[1] + (m[2] ? 'ที่แล้ว' : '') + ' (' + thaiDate(daysAgoStr(back)) + ')');
  });
  add('(?:อาทิตย์|สัปดาห์|วีค)\\s*(?:ก่อน|ที่แล้ว)', () => ({ from: daysAgoStr(13), to: daysAgoStr(7), label: '7 วันก่อนหน้า', kind: 'days', n: 7 }));
  add('(?:อาทิตย์|สัปดาห์|วีค)\\s*นี้|(?<!วัน)(?:อาทิตย์|สัปดาห์)(?!\\s*(?:ก่อน|ที่แล้ว))', () => ({ from: daysAgoStr(6), to: today, label: '7 วันล่าสุด', kind: 'days', n: 7 }));
  add('(\\d{1,2})\\s*เดือน\\s*(?:ล่าสุด|ที่ผ่านมา|ย้อนหลัง)', m => { const n = Number(m[1]); return { from: dateOf(cy, cm - n + 1, 1), to: today, label: n + ' เดือนล่าสุด', kind: 'range' }; });
  add('เดือน\\s*นี้', () => Object.assign(monthPeriod(cy, cm), { label: 'เดือนนี้ (' + MON_TH[cm-1] + ')' }));
  add('เดือน\\s*(?:ก่อน|ที่แล้ว)', () => { const d = new Date(cy, cm - 2, 1); return monthPeriod(d.getFullYear(), d.getMonth() + 1); });
  add('ปี\\s*นี้', () => ({ from: dateOf(cy, 1, 1), to: today, label: 'ปีนี้ (' + (cy + 543) + ')', kind: 'year' }));
  add('ปี\\s*(?:ก่อน|ที่แล้ว)', () => ({ from: dateOf(cy - 1, 1, 1), to: dateOf(cy - 1, 12, 31), label: 'ปี ' + (cy + 542), kind: 'year' }));
  add('ปี\\s*(?:พ\\.ศ\\.\\s*)?(\\d{2,4})', m => { const y = yearFrom(m[1]); return y ? { from: dateOf(y, 1, 1), to: dateOf(y, 12, 31), label: 'ปี ' + (y + 543), kind: 'year' } : null; });
  add('ทั้งหมด|ตั้งแต่ต้น|ตั้งแต่เปิด|รวมทุก|ทุกวัน', () => ({ from: '0000-00-00', to: '9999-99-99', label: 'ทั้งหมด', kind: 'all' }));
  // ตัดช่วงที่ซ้อนกัน (เก็บอันที่ยาวกว่า/มาก่อน)
  found.sort((a, b) => a.i - b.i || b.len - a.len);
  const keep = [];
  for(const f of found){ const last = keep[keep.length - 1]; if(last && f.i < last.i + last.len){ if(f.len > last.len && f.i === last.i) keep[keep.length - 1] = f; continue; } keep.push(f); }
  let rest = t;
  for(const f of [...keep].sort((a, b) => b.i - a.i)) rest = rest.slice(0, f.i) + ' ' + rest.slice(f.i + f.len);
  return { periods: keep.map(f => f.p), rest };
}

  if(/(?:ลูกค้า|ใคร|คนไหน).*(?:หายไป|หายหน้า|ไม่(?:ได้)?มานาน|นานแล้ว|ห่างหาย|ไม่ค่อยมา|เงียบไป)|(?:หายไป|หายหน้า|ห่างหาย).*(?:ลูกค้า|ใคร|คนไหน)/.test(t)) return 'gone';
  if(/(?:ลูกค้า|ใคร|คนไหน).*(?:ยัง)?ไม่(?:ได้)?(?:โอน|จ่าย|มา)|ยังไม่โอน.*(?:ใคร|บ้าง)/.test(t) && !nMent) return 'notPaid';

  if(/ล่าสุด|เพิ่งเข้า|เมื่อกี้|ตะกี้|รายการใหม่/.test(rest)) return 'latest';

  if(/ยอด|เท่าไหร่|เท่าไร|ได้กี่|กี่บาท|กี่ตัง|รวม|เข้ายัง|เข้ามายัง|เข้าไหม|เข้ามั้ย|มีไหม|มีมั้ย|เช็ค|เช็ก|หา/.test(t)) return 'sum';

/* ── คำนวณ ── */
function applyFilters(f, opt){
  opt = opt || {};
  const names = opt.names || (f.cust ? f.cust.names : null);
  return data.filter(r => {
    const p = opt.period !== undefined ? opt.period : f.period;
    if(p && !(r.date >= p.from && r.date <= p.to)) return false;
    if(f.type === 'out' && !isOut(r)) return false;
    if(f.type === 'in' && isOut(r)) return false;
    if(f.bank && r.bank !== f.bank) return false;
    if(f.amount && !amtOk(r, f.amount)) return false;
    if(f.verified === true && !r.slipVerified) return false;
    if(f.verified === false && (r.slipVerified || isOut(r))) return false;
    if(f.recorder && recorderOf(r).toLowerCase() !== f.recorder.toLowerCase()) return false;
    if(f.cust && !opt.noCust){
      if(names && names.length){ if(!names.includes((r.name || '').trim())) return false; }
      else if(f.cust.text){ const q = f.cust.text.toLowerCase(); if(!((r.name || '').toLowerCase().includes(q) || (r.note || '').toLowerCase().includes(q))) return false; }
    }
    return true;
  });
}
function custLabel(f){ return f.cust ? (f.cust.names.length ? (f.cust.names.length <= 2 ? f.cust.names.join(', ') : f.cust.names.length + ' ชื่อที่ตรง') : '"' + f.cust.text + '"') : ''; }
function filterLabel(f, noPeriod){
  const parts = [];
  if(f.cust) parts.push(custLabel(f));
  if(f.type === 'out') parts.push('จ่ายออก'); else if(f.type === 'in') parts.push('รับเข้า');
  if(f.bank) parts.push(f.bank);
  if(f.amount) parts.push(amtLabel(f.amount));
  if(f.verified === true) parts.push('ยืนยันธนาคารแล้ว'); else if(f.verified === false) parts.push('ยังไม่ตรวจสลิป');
  if(f.recorder) parts.push('บันทึกโดย ' + whoLabel(f.recorder));
  if(!noPeriod) parts.push(f.period ? f.period.label : 'ทั้งหมด');
  return parts.join(' · ');
}
const specific = f => !!(f.cust || f.bank || f.amount || f.verified != null || f.recorder);
const LEGEND = '\n\n✅ = ยืนยันกับธนาคารแล้ว · 📎 = มีสลิป · 📝 = กรอกเอง';
function listLines(list, n){ const s = sortRecent(list); return s.slice(0, n).map(recLine).join('\n') + (s.length > n ? '\n...และอีก ' + (s.length - n) + ' รายการ' : ''); }
function guessNote(f){ return f.cust && f.cust.guessed ? '🔎 น่าจะหมายถึง "' + f.cust.names.slice(0, 3).join('", "') + '" นะคะ\n' : ''; }
function thisMonthPeriod(){ const n = new Date(); return Object.assign(monthPeriod(n.getFullYear(), n.getMonth() + 1), { label: 'เดือนนี้' }); }
function defaultPeriod(f){ return f.period || thisMonthPeriod(); }
function prevPeriod(p){
  const span = daysBetween(p.from, p.to) + 1;
  if(p.kind === 'month'){ const [y, m] = p.from.split('-').map(Number); const d = new Date(y, m - 2, 1); return monthPeriod(d.getFullYear(), d.getMonth() + 1); }
  if(p.kind === 'year'){ const y = Number(p.from.slice(0, 4)) - 1; return { from: dateOf(y, 1, 1), to: dateOf(y, 12, 31), label: 'ปี ' + (y + 543), kind: 'year' }; }
  if(p.kind === 'day') return dayPeriod(addDays(p.from, -1));
  return { from: addDays(p.from, -span), to: addDays(p.from, -1), label: span + ' วันก่อนหน้า', kind: 'days', n: span };
}
// ภาษาพูด: สุ่มสำนวน (ทดสอบตั้ง _rng ให้คงที่ได้)
let _rng = Math.random;
function pick(arr){ return arr[Math.floor(_rng() * arr.length) % arr.length]; }
const B = n => fmt(n) + ' บาท';
function speakPeriod(p){ return p ? p.label : 'ทั้งหมด'; }
function firstDate(){ let d = null; for(const r of data) if(r.date && (!d || r.date < d)) d = r.date; return d; }
// รายรับเฉลี่ยต่อวัน ย้อนหลัง n วัน (ไม่นับวันนี้) — ใช้บอก "ปกติ" และประมาณการ
function dailyAvg(n, f){
  const today = todayStr(), fd = firstDate(); if(!fd) return null;
  let from = daysAgoStr(n); if(from < fd) from = fd;
  const to = daysAgoStr(1); if(to < from) return null;
  const days = daysBetween(from, to) + 1;
  if(days < 7) return null;   // ประวัติยังสั้น — ไม่เอามาเทียบ "ปกติ" (เปอร์เซ็นต์จะเพี้ยน)
  const tot = sumIn(applyFilters(Object.assign({}, f || {}, { type: 'in' }), { period: { from, to } }));
  return { avg: tot / days, days };
}
function vsNormal(v, avg){
  if(avg == null || avg <= 0) return '';
  const pct = Math.round((v - avg) / avg * 100);
  if(Math.abs(pct) < 15) return 'พอ ๆ กับปกติค่ะ';
  if(pct >= 200) return 'ดีกว่าปกติหลายเท่าเลยค่ะ 🎉';
  return pct > 0 ? pick(['ดีกว่าปกติ ' + pct + '% เลยค่ะ 🎉', 'สูงกว่าปกติ ' + pct + '% ค่ะ 👍']) : pick(['น้อยกว่าปกติ ' + (-pct) + '% ค่ะ', 'ต่ำกว่าปกติ ' + (-pct) + '% ค่ะ']);
}
// สรุปยอดแบบพูด: บรรทัดแรกตอบเลย แล้วค่อยรายละเอียด
function speakSummary(list, label, f){
  f = f || {};
  if(!list.length) return pick([label + ' ยังไม่มีรายการเลยค่ะ', label + ' ยังไม่มีรายการเข้ามาเลยค่ะ']);
  const tIn = sumIn(list), tOut = sumOut(list), net = tIn - tOut, nIn = list.filter(r => !isOut(r)).length;
  const verified = list.filter(r => !isOut(r) && r.slipVerified).length;
  let s;
  if(f.cust) s = custLabel(f) + ' ' + (f.period ? f.period.label + ' ' : '') + 'โอนมา ' + nIn + ' ครั้ง รวม ' + B(tIn) + 'ค่ะ';
  else if(tIn > 0) s = pick([label + ' ได้ ' + B(tIn) + 'ค่ะ 💰', label + ' เงินเข้า ' + B(tIn) + 'ค่ะ 💰']);
  else s = label + ' ยังไม่มีเงินเข้าค่ะ';
  if(!f.cust) s += '\nมี ' + nIn + ' รายการ' + (nIn ? ' · ตรวจสลิปกับธนาคารแล้ว ' + verified + '/' + nIn : '');
  if(tOut > 0) s += '\nจ่ายออกไป ' + B(tOut) + ' เหลือสุทธิ ' + B(net);
  return s;
}

  try { if(currentUser && window.firebase && firebase.apps && firebase.apps.length) firebase.database().ref('rooms/' + activeRoom + '/meta/unanswered').push({ q: rec.q, k: kind, at: rec.t, by: currentUser.email || '' }).catch(() => {}); } catch(e) {}
}
function unansweredList(){
  let local = []; try { local = JSON.parse(localStorage.getItem(UNANS_KEY) || '[]'); } catch(e) {}
  const all = local.map(x => ({ q: x.q, t: x.t })).concat(remoteUnans.map(x => ({ q: x.q, t: x.at || 0 })));
  const seen = new Set(), out = [];
  for(const x of all.sort((a, b) => b.t - a.t)){ const k = x.q.trim().toLowerCase(); if(seen.has(k)) continue; seen.add(k); out.push(x); }

}

        const days = []; const first = p.kind === 'all' ? (firstDate() || today) : p.from;
        for(let d = first; d <= (p.to < today ? p.to : today); d = addDays(d, 1)) days.push(d);
        if(!days.length) return none(p.label);
        rows = days.map(d => [d, byDay[d] || 0]).sort((x, y) => x[1] - y[1] || y[0].localeCompare(x[0])).slice(0, q.topN || 3);
      } else {
        rows = Object.entries(byDay).sort((x, y) => y[1] - x[1]).slice(0, q.topN || 3);
        if(!rows.length) return guessNote(f) + none(specific(f) ? filterLabel(f, true) + ' · ' + p.label : p.label);
      }
      const [d0, v0] = rows[0];
      const head = (q.intent === 'worstDay' ? p.label + ' วันที่ขายน้อยสุดคือ ' : p.label + ' วันที่ขายดีสุดคือ ') + thaiDate(d0) + ' ได้ ' + B(v0) + 'ค่ะ' + (q.intent === 'worstDay' ? '' : ' 🏆');
      return guessNote(f) + head + (specific(f) ? ' (' + filterLabel(f, true) + ')' : '') + '\n\n' + rows.map(([d, v], i) => (i + 1) + '. ' + thaiDate(d) + ' — ' + B(v) + ' (' + list.filter(r => r.date === d).length + ' รายการ)').join('\n') +
        (f.period ? '' : '\n\nถามช่วงอื่นได้ เช่น "วันไหนขายดีสุดเดือนก่อน"');
    }
    case 'avg': {
      const p = defaultPeriod(f);
      const list = applyFilters(Object.assign({}, f, { type: f.type || 'in' }), { period: p });
      if(!list.length) return guessNote(f) + none(p.label);
      const first = p.kind === 'all' ? firstDate() : p.from;
      const nDays = Math.max(1, daysBetween(first, p.to < today ? p.to : today) + 1);
      const tot = f.type === 'out' ? sumOut(list) : sumIn(list);
      return guessNote(f) + p.label + ' ' + (f.type === 'out' ? 'จ่ายออก' : 'ได้') + 'เฉลี่ยวันละ ' + B(Math.round(tot / nDays)) + 'ค่ะ (' + nDays + ' วัน)' + (specific(f) ? '\n(' + filterLabel(f, true) + ')' : '') +
        '\n• เฉลี่ยต่อรายการ ' + B(Math.round(tot / list.length)) + ' (' + list.length + ' รายการ)\n• รวม ' + B(tot);
    }
    case 'profit': {
      const p = defaultPeriod(f);
      const base = Object.assign({}, f); delete base.type;
      const list = applyFilters(base, { period: p });
      const i = sumIn(list), o = sumOut(list), net = i - o;
      return p.label + (net >= 0 ? ' กำไร: ' : ' ขาดทุน: ') + B(Math.abs(net)) + 'ค่ะ' + (net >= 0 ? ' 💹' : '') + (i > 0 ? ' (' + Math.round(net / i * 100) + '% ของรายรับ)' : '') +
        '\n• รับเข้า ' + B(i) + '\n• จ่ายออก ' + B(o) + '\n(คิดจากเงินเข้า−ออกที่บันทึกในระบบเท่านั้นนะคะ)';
    }
    case 'byRecorder': {
      const list = applyFilters(f);
      if(!list.length) return none(filterLabel(f));
      const g = {};
      list.forEach(r => { const k = whoLabel(recorderOf(r)) || '(ไม่ทราบ — รายการเก่า)'; g[k] = g[k] || { n: 0, s: 0 }; g[k].n++; g[k].s += Number(r.amount || 0); });
      const rows = Object.entries(g).sort((a, b) => b[1].n - a[1].n);
      return 'คนที่บันทึกเยอะสุดคือ ' + rows[0][0] + 'ค่ะ (' + speakPeriod(f.period) + ')\n\n' + rows.map(([k, v], i) => (i + 1) + '. ' + k + ' — ' + v.n + ' รายการ (' + B(v.s) + ')').join('\n');
    }
    case 'topCustCount': case 'topCustSum': {
      const list = applyFilters(Object.assign({}, f, { type: 'in' }));
      if(!list.length) return none(filterLabel(f));
      const g = {};
      list.forEach(r => { const n = r.name || 'ไม่ระบุ'; g[n] = g[n] || { n: 0, s: 0 }; g[n].n++; g[n].s += Number(r.amount || 0); });
      const bySum = q.intent === 'topCustSum';
      const rows = Object.entries(g).sort((a, b) => bySum ? (b[1].s - a[1].s || b[1].n - a[1].n) : (b[1].n - a[1].n || b[1].s - a[1].s)).slice(0, q.topN || 5);
      return (bySum ? 'คนที่โอนยอดรวมเยอะสุดคือ ' : 'ลูกค้าที่มาบ่อยสุดคือ ') + _noSent(rows[0][0]) + 'ค่ะ ⭐ (' + filterLabel(f) + ')\n\n' + rows.map(([n, v], i) => (i + 1) + '. ' + _noSent(n) + ' — ' + v.n + ' ครั้ง (รวม ' + B(v.s) + ')').join('\n');
    }
    case 'byBank': {
      const list = applyFilters(Object.assign({}, f, { type: f.type || 'in' }));
      if(!list.length) return none(filterLabel(f));
      const g = {}; list.forEach(r => { const b = r.bank || 'ไม่ระบุ'; g[b] = g[b] || { n: 0, s: 0 }; g[b].n++; g[b].s += Number(r.amount || 0); });
      const tot = list.reduce((s, r) => s + Number(r.amount || 0), 0) || 1;
      const rows = Object.entries(g).sort((a, b) => b[1].s - a[1].s);
      return 'เงิน' + (f.type === 'out' ? 'ออก' : 'เข้า') + 'ทาง' + rows[0][0] + 'เยอะสุดค่ะ 🏦 (' + filterLabel(f) + ')\n\n' + rows.map(([b, v]) => '• ' + b + ': ' + B(v.s) + ' · ' + v.n + ' รายการ (' + Math.round(v.s / tot * 100) + '%)').join('\n');
    }
    case 'topTx': {
      const list = applyFilters(Object.assign({}, f, { type: f.type || 'in' })).sort((a, b) => Number(b.amount || 0) - Number(a.amount || 0));
      if(!list.length) return guessNote(f) + none(filterLabel(f));
      const n = q.topN || 3;
      return guessNote(f) + 'ยอดสูงสุดคือ ' + B(list[0].amount) + ' จาก ' + _noSent(list[0].name || 'ไม่ระบุชื่อ') + 'ค่ะ 🏆 (' + filterLabel(f) + ')\n\n' + list.slice(0, n).map((r, i) => (i + 1) + '. ' + recLine(r)).join('\n');
    }
    case 'latest': {
      const list = applyFilters(f);
      if(!list.length) return guessNote(f) + none(filterLabel(f));
      const top = sortRecent(list)[0];
      return guessNote(f) + 'ล่าสุดคือ ' + _noSent(top.name || 'ไม่ระบุชื่อ') + ' ' + (isOut(top) ? 'จ่ายออก ' : '') + B(top.amount) + ' · ' + thaiDate(top.date) + 'ค่ะ\n\n' + Math.min(q.topN || 5, list.length) + ' รายการล่าสุด' + (specific(f) || f.period ? ' (' + filterLabel(f) + ')' : '') + ':\n' + listLines(list, q.topN || 5);
    }
    case 'countPeople': {
      const list = applyFilters(Object.assign({}, f, { type: f.type || 'in' }));
      const n = new Set(list.map(r => r.name || 'ไม่ระบุ')).size;
      return speakPeriod(f.period) + ' มีลูกค้า ' + n + ' คนค่ะ 👥 (' + list.length + ' รายการ รวม ' + B(sumIn(list) || sumOut(list)) + ')' + (specific(f) ? '\n(' + filterLabel(f, true) + ')' : '');
    }
    case 'count': {
      const list = applyFilters(f);
      if(!list.length) return guessNote(f) + none(filterLabel(f));
      const nIn = list.filter(r => !isOut(r)).length, nOut = list.length - nIn;
      const lastR = sortRecent(list)[0];
      const who = f.cust ? custLabel(f) + ' ' : '';
      return guessNote(f) + who + speakPeriod(f.period) + ' ' + (f.cust ? 'โอนมา ' : 'มี ') + list.length + ' ' + (f.cust ? 'ครั้ง' : 'รายการ') + 'ค่ะ' + (nOut ? ' (รับเข้า ' + nIn + ' · จ่ายออก ' + nOut + ')' : '') +
        '\nรวม ' + B(nOut && !nIn ? sumOut(list) : sumIn(list)) + (f.cust ? ' · ล่าสุด ' + thaiDate(lastR.date) + ' (' + B(lastR.amount) + ')' : '') +
        (!f.cust && specific(f) ? '\n(' + filterLabel(f, true) + ')' : '') + (list.length <= 6 ? '\n\n' + listLines(list, 6) : '');
    }
    case 'overview':
      if(!specific(f) && !f.period){
        if(!data.length) return 'ยังไม่มีรายการในระบบเลยค่ะ';
        const tD = sumIn(filterRange(today, today)), t7 = sumIn(filterRange(daysAgoStr(6), today));
        const tM = sumIn(data.filter(r => (r.date || '').slice(0, 7) === monthStr(0)));
        const tAll = sum(data);
        const custs = new Set(data.filter(r => !isOut(r)).map(r => r.name || 'ไม่ระบุ')).size;
        const inCount = data.filter(r => !isOut(r)).length, verified = data.filter(r => r.slipVerified).length;
        const d = dailyAvg(28);
        return 'สรุปภาพรวมให้นะคะ 📋\n' +
          '• วันนี้ได้ ' + B(tD) + (d ? ' (' + vsNormal(tD, d.avg).replace('ค่ะ', '').trim() + ')' : '') + '\n• 7 วันล่าสุด ' + B(t7) + '\n• เดือนนี้ ' + B(tM) + (goalAmt ? ' (' + Math.round(tM / goalAmt * 100) + '% ของเป้า)' : '') + '\n' +
          '• คงเหลือสุทธิทั้งหมด ' + B(tAll) + ' (' + data.length + ' รายการ)\n' +
          '• ลูกค้า ' + custs + ' คน · ตรวจสลิปแล้ว ' + verified + '/' + inCount +
          (pendingData.length ? '\n• 🕒 รออนุมัติ ' + pendingData.length + ' รายการ' : '');
      }
      // มีเงื่อนไข → สรุปตามเงื่อนไข
    case 'sum': case 'list': {
      const list = applyFilters(f);
      if(f.amount && f.amount.eq != null){
        const nToday = list.filter(r => r.date === today).length;
        if(!list.length) return guessNote(f) + (f.period ? 'ไม่มียอด ' + B(f.amount.eq) + ' ใน' + f.period.label + 'ค่ะ' : 'ยังไม่มียอด ' + B(f.amount.eq) + ' เข้ามาเลยค่ะ 🔍\nลองเช็คจำนวนเงินอีกครั้ง หรือรายการอาจยังไม่ถูกบันทึกนะคะ');
        const head = f.period ? 'เจอยอด ' + B(f.amount.eq) + ' ' + list.length + ' รายการใน' + f.period.label + 'ค่ะ'
          : nToday ? 'เข้าแล้วค่ะ ✅ วันนี้มียอด ' + B(f.amount.eq) + ' ' + nToday + ' รายการ' + (list.length > nToday ? ' (ทั้งหมด ' + list.length + ' รายการ)' : '')
          : 'วันนี้ยังไม่เห็นยอด ' + B(f.amount.eq) + 'ค่ะ แต่เคยมีเข้ามา ' + list.length + ' รายการ';
        return guessNote(f) + head + '\n\n' + listLines(list, 6) + LEGEND;
      }
      if(!list.length) return guessNote(f) + none(filterLabel(f));
      if(f.type === 'out') return speakPeriod(f.period) + ' จ่ายออกไป ' + B(sumOut(list)) + 'ค่ะ 💸 (' + list.length + ' รายการ)' + (specific(f) ? '\n(' + filterLabel(Object.assign({}, f, { type: null }), true) + ')' : '') + '\n\n' + listLines(list, 8);
      const s = speakSummary(list, speakPeriod(f.period) + (specific(f) && !f.cust ? ' (' + filterLabel(f, true) + ')' : ''), f);
      if(q.intent === 'list' || specific(f)) return guessNote(f) + s + '\n\n' + listLines(list, q.intent === 'list' ? 10 : 6);
      return s;
    }
  }
  return null;
}

const GENERIC = new Set(['sum', 'list', 'overview', 'count', 'countPeople']);
const OFFSCOPE_LOG = new Set(['why', 'advice', 'tax', 'timeOfDay', 'contact']);
function botReply(text){
  if(!ready) return 'ยังโหลดข้อมูลไม่เสร็จเลยค่ะ รอสักครู่แล้วถามใหม่นะคะ ⏳';
  const q = parseQuery(text);
  if(q.follow && lastQ){   // ถามต่อ: "แล้วเดือนก่อนล่ะ" → ใช้เงื่อนไขเดิม เปลี่ยนเฉพาะส่วนที่พูดถึงใหม่
    q.f = Object.assign({}, lastQ.f, q.f);
    if(!q.periods.length && lastQ.periods) q.periods = lastQ.periods;
    if(!q.intent || q.intent === 'sum') q.intent = lastQ.intent || q.intent;
    if(q.topN == null) q.topN = lastQ.topN;
    if(q.intent === 'howDay' && !q.periods.length) q.intent = 'sum';
  }
  if(!q.intent && Object.keys(q.f).length) q.intent = 'sum';   // มีแต่เงื่อนไข เช่น "สมชายเดือนนี้" → สรุปตามเงื่อนไข
  // ซื่อตรง: ถ้าเหลือคำที่ไม่รู้จัก และคำตอบจะเป็นแค่ "สรุปยอดแบบกลาง ๆ" → บอกว่าไม่เข้าใจส่วนไหน แทนการตอบมั่ว
  if(!q.intent || GENERIC.has(q.intent)){
    const unk = q.follow ? [] : unknownWords(q);
    if(unk.length){
      logUnanswered(text, 'partial'); lastIntent = 'partial';
      const understood = Object.keys(q.f).length ? filterLabel(q.f) : '';
      const fact = understood ? (() => { const l = applyFilters(q.f); return l.length ? '\nที่เข้าใจคือเรื่อง ' + understood + ' — มี ' + l.length + ' รายการ รวม ' + B(sumIn(l) || sumOut(l)) : '\nที่เข้าใจคือเรื่อง ' + understood; })() : '';
      return 'น้องเฮิร์ตยังไม่รู้จักคำว่า "' + unk.slice(0, 3).join('", "') + '" ค่ะ 🙏' + fact + '\nลองถามใหม่อีกแบบ หรือพิมพ์ "ช่วยเหลือ" ดูตัวอย่างนะคะ';
    }
  }
  const reply = q.intent ? answer(q, text) : null;
  lastIntent = reply ? q.intent : 'unknown';
  if(reply){
    if(OFFSCOPE_LOG.has(q.intent)) logUnanswered(text, q.intent);
    if(!['help', 'greet', 'thanks', 'chit', 'unanswered', 'modify', 'contact', 'tax', 'timeOfDay', 'advice'].includes(q.intent)) lastQ = { f: q.f, periods: q.periods, intent: q.intent, topN: q.topN };
    return reply;
  }
  logUnanswered(text, 'unknown');
  return 'ขอโทษค่ะ น้องเฮิร์ตยังไม่เข้าใจคำถามนี้ 🙏\nลองถามแบบนี้ดูนะคะ:\n• "วันนี้ได้กี่ตังค์แล้ว"\n• "สมชายโอนมายัง" / "590 เข้ายัง"\n• "วันนี้ขายดีไหม" / "เทียบเดือน"\n• "ลูกค้าคนไหนหายไปนาน" / "ถึงเป้ายัง"\nหรือพิมพ์ "ช่วยเหลือ" เพื่อดูทั้งหมดค่ะ';
}

const chatHistory = [];   // เก็บบทสนทนาไว้ให้ AI คุยต่อเนื่อง

// สรุปข้อมูลแบบกะทัดรัดส่งให้ AI (ยอดรวมช่วงต่าง ๆ + รายการล่าสุด)
function buildContext(){
  const today = todayStr();
  const lines = [];
  const agg = (list, label) => { const o = sumOut(list); return label + ': สุทธิ ' + fmt(sum(list)) + ' ฿ / ' + list.length + ' รายการ' + (o > 0 ? ' (จ่ายออก −' + fmt(o) + '฿)' : ''); };
  lines.push('วันนี้คือ ' + today + ' (' + thaiDate(today) + ')');
  lines.push(agg(filterRange(today, today), 'วันนี้'));
  lines.push(agg(filterRange(daysAgoStr(1), daysAgoStr(1)), 'เมื่อวาน'));
  lines.push(agg(filterRange(daysAgoStr(6), today), '7วันล่าสุด'));
  lines.push(agg(data.filter(r => (r.date||'').slice(0,7) === monthStr(0)), 'เดือนนี้'));
  lines.push(agg(data.filter(r => (r.date||'').slice(0,7) === monthStr(-1)), 'เดือนที่แล้ว'));
  lines.push(agg(data, 'ทั้งหมด'));
  const g = {};
  data.forEach(r => { const b = r.bank || 'ไม่ระบุ'; g[b] = (g[b]||0) + signedAmt(r); });
  lines.push('แยกธนาคาร (สุทธิ): ' + Object.entries(g).map(([b,s]) => b + '=' + fmt(s) + '฿').join(', '));
  const recent = sortRecent(data).slice(0, 200);
  lines.push('');
  lines.push('รายการ (ใหม่→เก่า, ' + recent.length + ' จาก ' + data.length + ' รายการ):');
  lines.push('รูปแบบ: วันที่ | ยอด(ลบ=จ่ายออก) | ชื่อ | ธนาคาร | สลิป | โน้ต');
  recent.forEach(r => {
    const slip = isOut(r) ? 'out' : (r.slipVerified ? 'verified' : (r.slipRef ? 'pending' : 'manual'));
    lines.push([r.date, signedAmt(r), r.name||'-', r.bank||'-', slip, r.note||''].join(' | '));
  });
  return lines.join('\n');
}

async function aiReply(text){
  const user = firebase.auth().currentUser;
  if(!user) throw new Error('no auth');
  const idToken = await user.getIdToken();
  const res = await fetch(AI_PROXY, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ idToken, question: text, context: buildContext(), history: chatHistory.slice(-8) })
  });
  const j = await res.json();
  if(!j.ok) throw new Error(j.error || 'ai error');
  return j.reply;
}

/* ripple ตอนแตะปุ่ม/เมนู */
document.addEventListener('pointerdown', function(e){
  const el = e.target.closest('#quick button, #inputbar button, .slipchip, .sugg button, .fchips button, #gBtn');
  if (!el) return;
  const r = el.getBoundingClientRect();
  const size = Math.max(r.width, r.height);
  const rip = document.createElement('span');
  rip.className = 'rip';
  rip.style.width = rip.style.height = size + 'px';
  rip.style.left = (e.clientX - r.left - size / 2) + 'px';
  rip.style.top = (e.clientY - r.top - size / 2) + 'px';
  el.appendChild(rip);
  setTimeout(function(){ rip.remove(); }, 560);
}, true);

function escHtml(s){ return (s||'').toString().replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c])); }
// จัดรูปคำตอบของน้องเฮิร์ต: บรรทัดแรก = หัวข้อ, ยอดเงินเด่น, รายการเป็นการ์ด, อันดับมีเหรียญ (escape ทุกบรรทัดก่อนเสมอ)
function fmtInline(e){ return e.replace(/([−-]?\d[\d,]*(?:\.\d+)?)\s?(บาท|฿)/g, '<b class="amt">$1 $2</b>').replace(/(\d+%)/g, '<b>$1</b>'); }
function renderBot(text){
  const slips = [];
  const t = String(text).replace(/⟦slip:([^⟧]+)⟧/g, (m, id) => { slips.push(id); return '\u0001' + (slips.length - 1) + '\u0001'; });
  let html = '', lead = true;
  for(const raw of t.split('\n')){
    const tr = raw.trim();
    if(!tr){ if(!lead) html += '<div class="gap"></div>'; continue; }
    const chips = [];
    const body = fmtInline(escHtml(tr).replace(/\u0001(\d+)\u0001/g, (m, i) => { chips.push('<button class="slipchip" data-slip="' + escHtml(slips[Number(i)]) + '" aria-label="ดูสลิป">👁️ ดู</button>'); return ''; }).trim());
    const tail = chips.join('');
    const rec = tr.match(/^(✅|📎|📝|💸)\s*(.*)$/);
    const recHtml = m => {
      const txt = m[2].replace(/\u0001\d+\u0001/g, '').trim(), k = txt.indexOf(' — ');
      const top = k > 0 ? txt.slice(0, k) : txt; let sub = k > 0 ? txt.slice(k + 3) : '', when = '';
      const j = sub.lastIndexOf(' · '); if(j > 0){ when = sub.slice(j + 3); sub = sub.slice(0, j); }
      return '<div class="rec"><span class="ri">' + m[1] + '</span><span class="rt"><span class="ra">' + fmtInline(escHtml(top)) + (when ? '<em>' + escHtml(when) + '</em>' : '') + '</span>' + (sub ? '<small>' + escHtml(sub) + '</small>' : '') + '</span>' + tail + '</div>';
    };
    if(/^🔎/.test(tr)){ html += '<div class="hint">' + body + '</div>'; continue; }
    if(lead){ html += '<div class="lead">' + body + tail + '</div>'; lead = false; continue; }
    if(/^✅ = /.test(tr) || /^(\(|\*|💬)/.test(tr) || /^\.\.\./.test(tr)){ html += '<div class="note">' + body + tail + '</div>'; continue; }
    if(rec && /[−-]?[\d,.]+ ฿/.test(tr)){ html += recHtml(rec); continue; }
    const rk = tr.match(/^(\d{1,2})\.\s+(.*)$/);
    if(rk){
      const inner = rk[2].match(/^(✅|📎|📝|💸)\s*(.*)$/);
      html += '<div class="rk r' + rk[1] + '"><span class="n">' + rk[1] + '</span>' + (inner ? recHtml(inner) : '<span>' + fmtInline(escHtml(rk[2].replace(/\u0001\d+\u0001/g, ''))) + tail + '</span>') + '</div>';
      continue;
    }
    if(/^•/.test(tr)){ html += '<div class="bl"><span>' + body.replace(/^•\s*/, '') + tail + '</span></div>'; continue; }
    html += '<div class="ln">' + body + tail + '</div>';
  }
  return html;
}
function nowHM(){ const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function scrollDown(){ requestAnimationFrame(() => chatEl.scrollTo({ top: chatEl.scrollHeight, behavior: 'smooth' })); }

    row.appendChild(av);

    d.textContent = text;

}
function showTyping(){
  const row = document.createElement('div'); row.className = 'row bot';

// ปุ่ม "ถามต่อ" ใต้คำตอบล่าสุด — เลือกตามเรื่องที่เพิ่งถาม
function followups(intent){
  const f = (lastQ && lastQ.f) || {}, nm = f.cust && f.cust.names && f.cust.names[0];
  const M = {
    yesno: nm ? [nm + ' เดือนนี้โอนกี่ครั้ง', 'ดูสลิป ' + nm] : [],
    howDay: ['พรุ่งนี้น่าจะได้เท่าไหร่', 'วันไหนขายดีสุด'],
    compare: ['วันไหนขายดีสุด', 'ลูกค้าคนไหนหายไปนาน'],
    bestDay: ['เฉลี่ยวันละเท่าไหร่', 'เทียบเดือน'], worstDay: ['วันไหนขายดีสุด', 'เทียบเดือน'],
    gone: ['ใครยังไม่โอนเดือนนี้', 'ลูกค้าใหม่เดือนนี้'], notPaid: ['ลูกค้าคนไหนหายไปนาน', 'ลูกค้าประจำ'], newCust: ['ลูกค้าประจำ', 'ลูกค้าคนไหนหายไปนาน'],
    goal: ['สิ้นเดือนน่าจะได้เท่าไหร่', 'วันนี้ขายดีไหม'], forecast: ['ถึงเป้ายัง', 'เทียบเดือน'],
    pending: ['ยังไม่ตรวจสลิป'], topCustSum: ['ลูกค้าคนไหนหายไปนาน', 'ลูกค้าใหม่เดือนนี้'], topCustCount: ['ลูกค้าคนไหนหายไปนาน', 'ลูกค้าใหม่เดือนนี้'],
    overview: ['วันนี้ขายดีไหม', 'ถึงเป้ายัง', 'ลูกค้าคนไหนหายไปนาน'], profit: ['เทียบเดือน', 'ค่าใช้จ่ายเดือนนี้'],
    unknown: ['สรุป', 'วันนี้ขายดีไหม', 'ช่วยเหลือ'], partial: ['ช่วยเหลือ'],
  };
  if(M[intent]) return M[intent];
  if(['sum', 'count', 'list', 'latest', 'dup', 'topTx'].includes(intent)) return nm ? [nm + 'โอนมายัง', 'ดูสลิป ' + nm, 'แล้วเดือนก่อนล่ะ'] : ['วันนี้ขายดีไหม', 'เทียบเดือน', 'ลูกค้าประจำ'];
  return [];
}
function addFollowups(col, list){
  chatEl.querySelectorAll('.fchips').forEach(x => x.remove());
  if(!col || !list || !list.length) return;
  const box = document.createElement('div'); box.className = 'fchips';
  list.slice(0, 3).forEach(q => { const b = document.createElement('button'); b.type = 'button'; b.textContent = q; b.onclick = () => send(q); box.appendChild(b); });
  col.appendChild(box); scrollDown();
}
// หน้าต้อนรับ: สรุปยอดสั้น ๆ + การ์ดคำถามแนะนำ
function kB(n){ n = Math.round(Number(n) || 0); return n >= 100000 ? (n / 1000).toFixed(0) + 'K' : n >= 10000 ? (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K' : fmt(n); }
function heroStats(){
  const td = todayStr(), ym = td.slice(0, 7);
  const tIn = sumIn(data.filter(r => r.date === td)), mIn = sumIn(data.filter(r => (r.date || '').slice(0, 7) === ym));
  const third = goalAmt ? ['เป้าเดือนนี้', Math.min(999, Math.round(mIn / goalAmt * 100)) + '%'] : ['รายการวันนี้', String(data.filter(r => r.date === td).length)];
  return '<div><span>วันนี้</span><b class="hl">' + kB(tIn) + ' ฿</b></div><div><span>เดือนนี้</span><b>' + kB(mIn) + ' ฿</b></div><div><span>' + third[0] + '</span><b>' + third[1] + '</b></div>';
}
function renderHero(){
  const h = new Date().getHours();
  const hi = h < 11 ? 'อรุณสวัสดิ์ค่ะ ☀️' : h < 16 ? 'สวัสดีตอนบ่ายค่ะ 👋' : h < 19 ? 'สวัสดีตอนเย็นค่ะ 🌇' : 'สวัสดีค่ะ 🌙';
  const S = [['💰', 'วันนี้ขายดีไหม', 'เทียบกับวันปกติ'], ['⏰', 'ใครยังไม่โอนเดือนนี้', 'ลูกค้าประจำที่ยังไม่มา'], ['📈', 'เทียบเดือน', 'เดือนนี้ vs เดือนก่อน'], ['🔮', 'สิ้นเดือนน่าจะได้เท่าไหร่', 'ประมาณการ + เป้า']];
  const el = document.createElement('div'); el.className = 'hero'; el.id = 'hero';
  el.innerHTML = '<div class="big-ava"><img src="hurt-logo.jpg" alt=""></div><h2><span>' + hi + '</span></h2><p>น้องเฮิร์ตช่วยดูยอดเงิน ลูกค้า และสลิปให้ ถามแบบคุยกันได้เลย</p>' +
    '<div class="stats3" id="heroStats">' + (ready ? heroStats() : '<div><span>วันนี้</span><b>—</b></div><div><span>เดือนนี้</span><b>—</b></div><div><span>เป้า</span><b>—</b></div>') + '</div>' +
    '<div class="sugg-t">ลองถามดู</div><div class="sugg">' + S.map(x => '<button type="button" data-q="' + escHtml(x[1]) + '"><span class="ic">' + x[0] + '</span>' + escHtml(x[1]) + '<small>' + escHtml(x[2]) + '</small></button>').join('') + '</div>';
  el.querySelectorAll('.sugg button').forEach(b => b.onclick = () => send(b.dataset.q));
  chatEl.appendChild(el);
}
function updateHero(){ const st = document.getElementById('heroStats'); if(st && ready) st.innerHTML = heroStats(); }
function resetChat(){
  chatEl.innerHTML = ''; lastQ = null; chatHistory.length = 0;
  renderHero(); inputEl.focus();
}
/* ---------- ดูรูปสลิป (ไลท์บ็อกซ์) ---------- */
let activeRoom = BAKED_ROOM;
async function openSlip(id){
  let box = document.getElementById('slipLightbox');
  if (!box) {
    box = document.createElement('div'); box.id = 'slipLightbox'; box.className = 'slip-lightbox';
    box.innerHTML = '<img id="slipLbImg" alt="สลิป" style="display:none"><div id="slipLbMsg" class="slip-lb-msg"></div><div class="slip-lb-close">แตะเพื่อปิด</div>';
    box.addEventListener('click', () => box.classList.remove('show'));
    document.body.appendChild(box);
  }
  const imgEl = document.getElementById('slipLbImg'), msg = document.getElementById('slipLbMsg');
  imgEl.style.display = 'none'; msg.style.display = 'block'; msg.textContent = '⏳ กำลังโหลดสลิป...';
  box.classList.add('show');
  try {
    const snap = await firebase.database().ref('rooms/' + activeRoom + '/slips/' + id).once('value');
    const v = snap.val();
    const src = (v && typeof v === 'object') ? v.img : v;
    if (src) { imgEl.src = src; imgEl.style.display = 'block'; msg.style.display = 'none'; }
    else { msg.textContent = 'ไม่พบรูปสลิป (อาจเป็นรายการเก่าก่อนเปิดฟีเจอร์เก็บสลิป)'; }
  } catch (e) { msg.textContent = 'โหลดสลิปไม่ได้: ' + (e.message || ''); }
}
async function send(preset){
  const text = (preset || inputEl.value).trim();
  if(!text) return;
  inputEl.value = ''; document.getElementById('sendBtn').disabled = true;
  chatEl.querySelectorAll('.fchips').forEach(x => x.remove());
  addMsg(text, 'user');
  const typing = showTyping();

  let reply, viaAI = false;
  if(AI_PROXY && ready && window.firebase && firebase.auth){
    try { reply = await aiReply(text); viaAI = true; }
    catch(e){ reply = null; }
  }
  if(reply == null){
    await new Promise(r => setTimeout(r, 420));
    reply = botReply(text) + (AI_PROXY && !viaAI && ready ? '\n\n(⚡ โหมดสำรอง — เชื่อมต่อ AI ไม่ได้ชั่วคราว)' : '');
  }
  typing.remove();
  const col = addMsg(reply, 'bot');
  addFollowups(col, followups(viaAI ? 'overview' : lastIntent));
  chatHistory.push({ role: 'user', content: text }, { role: 'assistant', content: reply });
  if(chatHistory.length > 16) chatHistory.splice(0, chatHistory.length - 16);
}
(function renderQuick(){
  const q = document.getElementById('quick');
  QUICK.forEach(([ic, label]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = '<span>' + ic + '</span>' + escHtml(label);
    b.onclick = () => send(label);
    q.appendChild(b);
  });
})();

/* ═══════════ sync / auth — ตรรกะเดียวกับ bank.html ═══════════ */
function setSync(on, text){
  document.getElementById('syncDot').className = 'on' + (on ? ' live' : '');
  document.getElementById('syncText').textContent = text;
}
function parseConfig(raw){
  raw = raw.trim();
  const i = raw.indexOf('{'), j = raw.lastIndexOf('}');
  if(i >= 0 && j > i) raw = raw.slice(i, j+1);
  try { return JSON.parse(raw); } catch(e){ try { return (new Function('return (' + raw + ')'))(); } catch(e2){ return null; } }
}
function activeConfig(){
  const rawCfg = localStorage.getItem(CFGKEY);
  if(rawCfg){ const c = parseConfig(rawCfg); if(c) return { cfg: c, room: localStorage.getItem(ROOMKEY) || BAKED_ROOM }; }
  if(BAKED_CONFIG && BAKED_CONFIG.apiKey) return { cfg: BAKED_CONFIG, room: BAKED_ROOM };
  return null;
}
function isAllowed(email){ return !!email && ALLOWED_EMAILS.map(e => e.toLowerCase()).includes(email.toLowerCase()); }
function showLogin(msg, email){
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginMsg').textContent = msg || 'เข้าสู่ระบบเพื่อใช้งาน';
  document.getElementById('gBtn').style.display = email ? 'none' : 'flex';
  document.getElementById('loginSignout').style.display = email ? 'block' : 'none';
}
function hideLogin(){ document.getElementById('loginScreen').style.display = 'none'; }
function googleSignIn(){
  // หน้านี้เปิดใน iframe ของแอปหลัก — ล็อกอินจริงทำที่หน้าหลัก (iOS: popup/redirect ในเฟรมใช้ไม่ได้)
  const inFrame = (function(){ try { return window.top !== window.self; } catch (e) { return true; } })();
  const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent||'') || (/Macintosh/.test(navigator.userAgent||'') && 'ontouchend' in document);
  if (inFrame || ios) {
    const el = document.getElementById('loginMsg');
    if (el) el.textContent = 'กรุณาล็อกอินที่หน้าหลักก่อนค่ะ\nปิดหน้านี้ (แตะแท็บ "หน้าแรก") → เข้าสู่ระบบ → แล้วกลับมาที่ผู้ช่วยอีกครั้ง';
    return;
  }
  const provider = new firebase.auth.GoogleAuthProvider();
  firebase.auth().signInWithPopup(provider).catch(err => {
    if(err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') return;
    if(err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment'){
      firebase.auth().signInWithRedirect(provider);
    } else {
      alert('เข้าสู่ระบบไม่สำเร็จ: ' + (err.message || err.code));
    }
  });
}
function googleSignOut(){ if(window.firebase && firebase.auth) firebase.auth().signOut().then(() => location.reload()); }

function connectRT(cfg, room){
  activeRoom = room;
  try { if(!app) app = firebase.initializeApp(cfg); } catch(e){}
  setSync(false, 'กำลังเชื่อมต่อ...');
  try {
    const db = firebase.database();
    db.ref('.info/connected').on('value', snap => {
      if(snap.val() === true) setSync(true, 'ออนไลน์ · ' + data.length + ' รายการ' + (AI_PROXY ? ' · AI ✨' : ''));
      else setSync(false, 'กำลังเชื่อมต่อ...');
    });
    db.ref('rooms/' + room + '/transfers').on('value', snap => {
      data = Object.values(snap.val() || {}).map(normalizeRec).filter(Boolean);
      const first = !ready;
      ready = true;
      setSync(true, 'ออนไลน์ · ' + data.length + ' รายการ' + (AI_PROXY ? ' · AI ✨' : ''));
      updateHero();
    }, err => {
      setSync(false, 'เชื่อมต่อไม่ได้');
      loadLocalFallback();
    });
    // คิวรออนุมัติ + เป้ายอด (อ่านอย่างเดียว — ถ้า rules ไม่เปิด path ไหนก็ข้ามเงียบๆ)
    db.ref('rooms/' + room + '/pending').on('value', snap => {
      pendingData = Object.values(snap.val() || {}).filter(x => x && typeof x === 'object' && x.id);
    }, () => { pendingData = []; });
    db.ref('rooms/' + room + '/meta/unanswered').limitToLast(50).on('value', snap => {
      remoteUnans = Object.values(snap.val() || {}).filter(x => x && x.q);
    }, () => {});
    db.ref('rooms/' + room + '/meta/goal').on('value', snap => {
      const v = Number(snap.val()); if(isFinite(v) && v >= 0) goalAmt = v;
    }, () => {});
  } catch(e){
    setSync(false, 'config ไม่ถูกต้อง');
    loadLocalFallback();
  }
}
function loadLocalFallback(){
  try { data = (JSON.parse(localStorage.getItem(LKEY)) || []).map(normalizeRec).filter(Boolean); } catch(e){ data = []; }
  ready = true; updateHero();
  setSync(false, 'โหมดออฟไลน์ · ' + data.length + ' รายการ');
  addMsg('⚠️ เชื่อมต่อฐานข้อมูลไม่ได้ ใช้ข้อมูลสำรองในเครื่องนี้แทน (' + data.length + ' รายการ)', 'bot');
}

/* ═══════════ boot ═══════════ */
try { const g = Number(localStorage.getItem('bank_goal_month')); if(isFinite(g) && g > 0) goalAmt = g; } catch(e) {}   // เป้าที่หน้าแรกจำไว้ (โดเมนเดียวกัน) — ใช้ก่อน/แทนค่าจาก Firebase
renderHero();
(function boot(){
  const ac = activeConfig();
  if(!ac){ hideLogin(); loadLocalFallback(); return; }
  try { if(!app) app = firebase.initializeApp(ac.cfg); } catch(e){}
  // เบี่ยง auth ผ่าน Worker authproxy เหมือน bank.html (เข้า googleapis ตรงช้ามากบนมือถือผู้ใช้)
  try {
    const d = firebase.auth()._delegate;
    if (d && d.config) {
      d.config.apiHost = 'authproxy.chitipat-kao.workers.dev/itk';
      d.config.tokenApiHost = 'authproxy.chitipat-kao.workers.dev/sts';
    }
  } catch (e) {}
  try { firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function(){}); } catch (e) {}
  showLogin('กำลังตรวจสอบ...');
  firebase.auth().onAuthStateChanged(user => {
    if(user && isAllowed(user.email)){
      currentUser = user;
      hideLogin();
      connectRT(ac.cfg, ac.room);
    } else if(user){
      showLogin('บัญชี ' + user.email + ' ไม่มีสิทธิ์เข้าถึงระบบนี้\nติดต่อเจ้าของระบบเพื่อขอสิทธิ์', user.email);
    } else {
      showLogin('เข้าสู่ระบบด้วย Google เพื่อใช้งาน');
    }
  });
})();
