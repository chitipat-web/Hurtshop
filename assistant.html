<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  input, select, textarea, button { font-family: inherit; }
  :root {
    --bg: #0b1620; --card: #15242f; --card2: #1d3340; --line: #2c4452;
    --text: #f1f5f9; --muted: #93acba; --green: #22c55e; --green-d: #16a34a;
    --blue: #00a4e4; --red: #ef4444; --accent: #4cc9f0; --amber: #f59e0b;
    --cyan: #00a4e4; --cyan-d: #0086c9;
    --glass:    rgba(255,255,255,.035);
    --glass-2:  rgba(255,255,255,.06);
    --glass-bd: rgba(255,255,255,.14);
    --glass-hi: rgba(255,255,255,.28);
    --blur:     saturate(180%) blur(22px);
    --glass-sh: 0 8px 30px rgba(0,0,0,.30);
    --inset-hi: inset 0 1px 0 var(--glass-hi), inset 0 0 0 .5px rgba(255,255,255,.05);
  }
  html, body { height: 100%; }
  body {
    font-family: 'IBM Plex Sans Thai', -apple-system, BlinkMacSystemFont, "Segoe UI", "Sukhumvit Set", "Helvetica Neue", sans-serif;
    color: var(--text);
    background:
      radial-gradient(1100px 620px at 82% -8%,  rgba(0,164,228,.22), transparent 60%),
      radial-gradient(820px 520px at -12% 18%,  rgba(0,164,228,.18), transparent 55%),
      var(--bg);
    background-attachment: fixed;
    display: flex; flex-direction: column;
    height: 100dvh;
    -webkit-text-size-adjust: 100%;
  }
  header {
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    display: flex; align-items: center; gap: 11px;
    background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    border-bottom: 1px solid var(--glass-bd);
    flex-shrink: 0;
  }
  header a.back {
    color: var(--accent); text-decoration: none; font-size: 20px;
    width: 36px; height: 36px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: var(--glass-2); border: 1px solid var(--glass-bd);
    box-shadow: var(--inset-hi);
  }
  .bot-ava {
    width: 40px; height: 40px; border-radius: 13px; flex-shrink: 0;
    background: linear-gradient(135deg, rgba(0,164,228,.35), rgba(0,164,228,.12));
    border: 1px solid var(--glass-bd);
    display: flex; align-items: center; justify-content: center; font-size: 21px;
    box-shadow: var(--inset-hi);
  }
  header .t h1 { font-size: 16px; font-weight: 700; letter-spacing: .3px; }
  header .t p { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.on { background: var(--green); box-shadow: 0 0 8px rgba(34,197,94,.8); }
  #chat {
    flex: 1; overflow-y: auto;
    padding: 16px 14px 6px;
    display: flex; flex-direction: column; gap: 10px;
    scroll-behavior: smooth;
  }
  .msg {
    max-width: 86%;
    padding: 11px 14px;
    border-radius: 17px;
    font-size: 14.5px; line-height: 1.6;
    white-space: pre-line; word-break: break-word;
    animation: pop .18s ease-out;
  }
  @keyframes pop { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
  .msg.bot {
    background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    border: 1px solid var(--glass-bd);
    box-shadow: var(--glass-sh), var(--inset-hi);
    align-self: flex-start; border-bottom-left-radius: 6px;
  }
  .msg.user {
    background: linear-gradient(135deg, var(--cyan), var(--cyan-d));
    color: #04283a; font-weight: 500;
    align-self: flex-end; border-bottom-right-radius: 6px;
    box-shadow: 0 4px 18px rgba(0,164,228,.25);
  }
  .msg .big { font-size: 22px; font-weight: 700; color: var(--accent); }
  .msg .ok { color: #86efac; }
  .msg .warn { color: #fcd34d; }
  .msg .bad { color: #fca5a5; }
  .msg .sub { color: var(--muted); font-size: 12.5px; }
  .typing {
    align-self: flex-start;
    background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    border: 1px solid var(--glass-bd);
    border-radius: 17px; border-bottom-left-radius: 6px;
    padding: 13px 16px; display: flex; gap: 5px;
    box-shadow: var(--glass-sh), var(--inset-hi);
  }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity: .25; } 40% { opacity: 1; } }
  #quick {
    display: flex; gap: 8px;
    padding: 8px 14px;
    overflow-x: auto; flex-shrink: 0;
    -webkit-overflow-scrolling: touch;
  }
  #quick::-webkit-scrollbar { display: none; }
  #quick button {
    flex-shrink: 0;
    background: var(--glass-2); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    color: var(--accent);
    border: 1px solid var(--glass-bd);
    border-radius: 999px;
    padding: 8px 14px; font-size: 13px;
    cursor: pointer; white-space: nowrap;
    box-shadow: var(--inset-hi);
  }
  #quick button:active { background: rgba(0,164,228,.15); }
  #inputbar {
    display: flex; gap: 8px;
    padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
    background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    border-top: 1px solid var(--glass-bd);
    flex-shrink: 0;
  }
  #inputbar input {
    flex: 1;
    background: var(--glass-2);
    border: 1px solid var(--glass-bd);
    border-radius: 999px;
    padding: 11px 16px;
    font-size: 15px; color: var(--text);
    outline: none;
    box-shadow: var(--inset-hi);
  }
  #inputbar input::placeholder { color: var(--muted); }
  #inputbar input:focus { border-color: var(--accent); }
  #inputbar button {
    background: linear-gradient(135deg, var(--cyan), var(--cyan-d));
    color: #04283a;
    border: none; border-radius: 50%;
    width: 46px; height: 46px; font-size: 18px;
    cursor: pointer; flex-shrink: 0;
    box-shadow: 0 4px 18px rgba(0,164,228,.35);
  }
  #inputbar button:active { transform: scale(.94); }
  /* login screen — เหมือน bank.html */
  #loginScreen {
    position: fixed; inset: 0; z-index: 150;
    background: var(--bg);
    background:
      radial-gradient(1100px 620px at 82% -8%,  rgba(0,164,228,.22), transparent 60%),
      radial-gradient(820px 520px at -12% 18%,  rgba(0,164,228,.18), transparent 55%),
      var(--bg);
    display: none; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  #loginScreen .card {
    background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    border: 1px solid var(--glass-bd); border-radius: 22px;
    box-shadow: var(--glass-sh), var(--inset-hi);
    padding: 34px 26px; max-width: 340px; width: 100%;
  }
  #loginScreen img { width: 74px; height: 74px; border-radius: 20px; margin-bottom: 14px; }
  #loginScreen h2 { font-size: 19px; margin-bottom: 6px; }
  #loginScreen p { color: var(--muted); font-size: 13.5px; white-space: pre-line; line-height: 1.6; margin-bottom: 20px; }
  #gBtn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; background: #fff; color: #1f2933;
    border: none; border-radius: 14px; padding: 13px;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  #loginSignout { display: none; margin-top: 14px; background: none; border: none; color: var(--accent); font-size: 13.5px; cursor: pointer; text-decoration: underline; }
  /* ปุ่มดูสลิปในแชท + ไลท์บ็อกซ์ */
  .slipchip { display: inline-flex; align-items: center; gap: 4px; margin: 6px 6px 0 0; background: var(--glass-2); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border: 1px solid var(--glass-bd); color: var(--accent); border-radius: 999px; padding: 5px 12px; font-size: 12.5px; cursor: pointer; font-family: inherit; box-shadow: var(--inset-hi); }
  .slip-lightbox { position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,.88); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; padding: 20px; flex-direction: column; }
  .slip-lightbox.show { display: flex; }
  .slip-lightbox img { max-width: 100%; max-height: 82vh; border-radius: 14px; box-shadow: 0 12px 44px rgba(0,0,0,.7); }
  .slip-lb-msg { color: #cfeef7; font-size: 14px; margin-top: 14px; text-align: center; }
  .slip-lb-close { color: #cfeef7; font-size: 13px; margin-top: 16px; opacity: .8; }
  /* ripple ตอนแตะ */
  #quick button, #inputbar button, .slipchip, #gBtn { position: relative; overflow: hidden; }
  .rip { position: absolute; border-radius: 50%; transform: scale(0); background: rgba(255,255,255,.38); pointer-events: none; animation: rip .55s cubic-bezier(.25,.7,.35,1) forwards; z-index: 3; }
  #gBtn .rip { background: rgba(0,0,0,.13); }
  #inputbar button .rip { background: rgba(4,40,58,.28); }
  @keyframes rip { to { transform: scale(2.5); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .rip { display: none; } }
</style>

<body>

<header>
  <a class="back" href="./" aria-label="กลับ">‹</a>
  <div class="bot-ava">🤖</div>
  <div class="t">
    <h1>น้องเฮิร์ต — ผู้ช่วยร้าน</h1>
    <p><span class="dot" id="syncDot"></span> <span id="syncText">กำลังเชื่อมต่อ...</span></p>
  </div>
</header>

<div id="chat"></div>
<div id="quick"></div>

<div id="inputbar">
  <input id="input" type="text" placeholder="ถามได้เลย เช่น สมชายเดือนนี้โอนกี่ครั้ง" autocomplete="off"
         onkeydown="if(event.key==='Enter')send()">
  <button onclick="send()" aria-label="ส่ง">➤</button>
</div>

<div id="loginScreen">
  <div class="card">
    <img src="hurt-logo.jpg" alt="HURT SHOP" onerror="this.style.display='none'">
    <h2>ผู้ช่วย HURT SHOP</h2>
    <p id="loginMsg">เข้าสู่ระบบเพื่อใช้งาน</p>
    <button id="gBtn" onclick="googleSignIn()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C40.9 35.4 44 30.2 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
      เข้าสู่ระบบด้วย Google
    </button>
    <button id="loginSignout" onclick="googleSignOut()">ออกจากระบบ / เปลี่ยนบัญชี</button>
  </div>
</div>

<script>
// iOS: กัน Firebase auth หยุดรอโหลด apis.google.com (เหตุเดียวกับ bank.html — เน็ตมือถือเข้าโฮสต์นี้ช้ามาก)
(function () {
  var ua = navigator.userAgent || '';
  var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document);
  if (!ios) return;
  window.gapi = { load: function (n, p) { try { if (p && p.ontimeout) p.ontimeout(); else if (typeof p === 'function') p(); } catch (e) {} } };
})();
</script>

<script src="vendor/firebase/firebase-database-compat.js"></script>
<script src="vendor/firebase/firebase-auth-compat.js"></script>
<script>
/* ═══════════ config เดียวกับ bank.html ═══════════ */
const LKEY = 'bank_transfers_v1';
const CFGKEY = 'bank_fb_config';
const ROOMKEY = 'bank_room';
const BAKED_CONFIG = {
  apiKey: "AIzaSyA68TcgHOPQb8FwiOZYD36gkBJNLl3juEg",
  authDomain: "bank-48baf.firebaseapp.com",
  databaseURL: "https://bank-48baf-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "bank-48baf",
  storageBucket: "bank-48baf.firebasestorage.app",
  messagingSenderId: "273049715377",
  appId: "1:273049715377:web:9e8f042190a69b92d91890",
  measurementId: "G-TW7M8QZ3KW"
};
const BAKED_ROOM = "main";

// ── โหมด AI เต็มตัว (Claude) ──
// วาง URL ของ Claude Proxy Worker ที่ deploy แล้ว เช่น "https://hurt-ai.xxx.workers.dev"
// ถ้าเว้นว่าง "" → ใช้โหมดตอบตามกติกา (rule-based) เหมือนเดิม ไม่มีค่าใช้จ่าย
const AI_PROXY = "";

const OWNER_EMAILS = ["chitipat.kao@gmail.com"];
const EMPLOYEE_EMAILS = ["dynosgaming01@gmail.com", "chitipat.kee@gmail.com"];
const ALLOWED_EMAILS = [...OWNER_EMAILS, ...EMPLOYEE_EMAILS];

let data = [];
let app = null;
let ready = false;

/* ═══════════ helpers ═══════════ */
const MON_TH = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
function fmt(n){ return Number(n).toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:2}); }
function localDateStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayStr(){ return localDateStr(new Date()); }
function thaiDate(s){
  if(!s) return '-';
  const p = s.split('-');
  const m = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return Number(p[2]) + ' ' + m[Number(p[1])-1] + ' ' + (Number(p[0])+543).toString().slice(-2);
}
function daysAgoStr(n){ const d = new Date(); d.setDate(d.getDate()-n); return localDateStr(d); }
function monthStr(offset){ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()+offset); return localDateStr(d).slice(0,7); }

/* ── normalize (รหัสธนาคาร/วันที่ ให้ตรงกับหน้าหลัก) ── */
const BANK_CODE = { '001':'ธปท.','002':'กรุงเทพ','004':'กสิกรไทย','006':'กรุงไทย','008':'JPMorgan','009':'OCBC',
  '011':'ทหารไทยธนชาต','014':'ไทยพาณิชย์','017':'ซิตี้แบงก์','018':'ซูมิโตโม','020':'สแตนดาร์ดชาร์เตอร์ด',
  '022':'CIMB','024':'UOB','025':'กรุงศรีอยุธยา','030':'ออมสิน','031':'HSBC','033':'ธอส.','034':'ธ.ก.ส.',
  '039':'มิซูโฮ','045':'BNP','065':'ธนชาต','066':'อิสลาม','067':'ทิสโก้','069':'เกียรตินาคินภัทร',
  '070':'ICBC','071':'ไทยเครดิต','073':'แลนด์แอนด์เฮ้าส์','098':'SME Bank' };
function normBank(b){ b=(b||'').toString().trim(); const c=b.replace(/\D/g,''); if(/^\d{2,3}$/.test(c)) return BANK_CODE[c.padStart(3,'0')] || ('ธนาคาร '+c); return b; }
function ymd(y,mo,da){ y=Number(y); if(y>2200) y-=543; return String(y).padStart(4,'0')+'-'+String(Number(mo)).padStart(2,'0')+'-'+String(Number(da)).padStart(2,'0'); }
function normDate(s){
  s=(s||'').toString().trim();
  if(/^\d{13}$/.test(s)){ const d=new Date(Number(s)); if(!isNaN(d.getTime())) return localDateStr(d); }
  if(/^\d{10}$/.test(s)){ const d=new Date(Number(s)*1000); if(!isNaN(d.getTime())) return localDateStr(d); }
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return ymd(m[1],m[2],m[3]);
  m=s.match(/^(\d{4})(\d{2})(\d{2})(?!\d)/);     if(m) return ymd(m[1],m[2],m[3]);
  m=s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})/); if(m) return ymd(m[3],m[2],m[1]);
  const d=new Date(s); if(!isNaN(d.getTime())) return localDateStr(d);
  return todayStr();
}
function normalizeRec(r){ return (r && typeof r==='object') ? Object.assign({}, r, { date: normDate(r.date), bank: normBank(r.bank) }) : null; }   // ให้ตรงกับ bank.html: รายการไม่มี date ก็เก็บ (เติมเป็นวันนี้) ยอดจะได้ตรงกันสองหน้า

function filterRange(from, to){
  return data.filter(r => r.date >= from && r.date <= to);
}
const isOut = r => !!(r && r.type === 'out');                       // รายการจ่ายออก
const signedAmt = r => Number(r && r.amount || 0) * (isOut(r) ? -1 : 1);   // เข้า=+, ออก=− (เหมือน bank.html)
function sum(list){ return list.reduce((s,r) => s + signedAmt(r), 0); }    // ยอดสุทธิ = รับเข้า − จ่ายออก
function sumIn(list){ return list.filter(r => !isOut(r)).reduce((s,r) => s + Number(r.amount||0), 0); }
function sumOut(list){ return list.filter(isOut).reduce((s,r) => s + Number(r.amount||0), 0); }
const _noSent = s => String(s == null ? '' : s).replace(/[⟦⟧]/g, '');   // ตัดวงเล็บพิเศษออกจากข้อความผู้ใช้ กันฝังปุ่ม "ดูสลิป" ปลอมชี้ไปสลิปคนอื่น (พนักงานคุม name/note ได้)
function recLine(r){
  const nm = _noSent(r.name) || 'ไม่ระบุชื่อ', bk = _noSent(r.bank), nt = _noSent(r.note);
  const hasSlip = (r.slipVerified || r.hasImg || r.slipHash) && r.id;   // มี slipHash (ผ่านคิว) ก็ถือว่ามีสลิป
  const slip = hasSlip ? ' ⟦slip:' + r.id + '⟧' : '';
  if (isOut(r)) return '💸 −' + fmt(r.amount) + ' ฿ (จ่ายออก) — ' + nm + (bk ? ' (' + bk + ')' : '') + ' · ' + thaiDate(r.date) + (nt ? '\n    💬 ' + nt : '') + slip;
  const v = r.slipVerified ? '✅' : ((r.slipRef || r.slipHash || r.hasImg) ? '📎' : '📝');
  return v + ' ' + fmt(r.amount) + ' ฿ — ' + nm + (bk ? ' (' + bk + ')' : '') + ' · ' + thaiDate(r.date) + (nt ? '\n    💬 ' + nt : '') + slip;
}
function sortRecent(list){
  return [...list].sort((a,b) => (b.date||'').localeCompare(a.date||'') || String(b.id||'').localeCompare(String(a.id||'')));
}

/* ═══════════ สมองผู้ช่วย: แยกคำถาม → เงื่อนไข (ใคร/เมื่อไหร่/ยอด/ธนาคาร/ประเภท/คนบันทึก) → คำนวณจากข้อมูลจริง ═══════════ */
let pendingData = [];

function summaryReply(list, label){
  if(!list.length) return '📊 ' + label + ': ยังไม่มีรายการเลยค่ะ';
  const net = sum(list), tIn = sumIn(list), tOut = sumOut(list);
  const nIn = list.filter(r => !isOut(r)).length;
  const inList = list.filter(r => !isOut(r)), verified = inList.filter(r => r.slipVerified).length;
  let s = '📊 ' + label + '\n' + 'ยอดสุทธิ: ' + fmt(net) + ' ฿';
  if (tOut > 0) s += '\nรับเข้า: ' + fmt(tIn) + ' ฿ · จ่ายออก: −' + fmt(tOut) + ' ฿';
  s += '\nจำนวน: ' + list.length + ' รายการ (เงินเข้าตรวจสลิปแล้ว ' + verified + '/' + inList.length + ')';
  if (nIn > 0) s += '\nเฉลี่ยเงินเข้า: ' + fmt(Math.round(tIn/nIn*100)/100) + ' ฿/รายการ';
  return s;
}

function addDays(s, n){ const [y,m,d] = s.split('-').map(Number); return localDateStr(new Date(y, m-1, d+n)); }
function dateOf(y, m, d){ return localDateStr(new Date(y, m-1, d)); }
function daysBetween(a, b){ const [y1,m1,d1] = a.split('-').map(Number), [y2,m2,d2] = b.split('-').map(Number); return Math.round((new Date(y2,m2-1,d2) - new Date(y1,m1-1,d1)) / 864e5); }
function monthPeriod(y, m){ return { from: dateOf(y, m, 1), to: dateOf(y, m+1, 0), label: MON_TH[m-1] + ' ' + (y+543), kind: 'month' }; }
function dayPeriod(s, label){ return { from: s, to: s, label: label || thaiDate(s), kind: 'day' }; }
function yearFrom(tok){   // "69" / "2569" / "2026" → ค.ศ. ; อย่างอื่น (เช่น 500) = ไม่ใช่ปี
  if(!tok) return null;
  let y = Number(tok);
  if(tok.length === 2 && y >= 60 && y <= 99) return y + 2500 - 543;
  if(y >= 2500 && y <= 2700) return y - 543;
  if(y >= 2000 && y <= 2150) return y;
  return null;
}

const WEEKDAYS = { 'อาทิตย์':0, 'จันทร์':1, 'อังคาร':2, 'พุธ':3, 'พฤหัสบดี':4, 'พฤหัส':4, 'ศุกร์':5, 'เสาร์':6 };
// หาช่วงเวลาทั้งหมดในประโยค (เรียงตามตำแหน่ง) — คืน periods + ข้อความที่ตัดส่วนวันที่ออกแล้ว
function parsePeriods(t){
  const today = todayStr(), now = new Date(), cy = now.getFullYear(), cm = now.getMonth() + 1, cd = now.getDate();
  const found = [];
  const add = (re, fn) => { let m; const g = new RegExp(re, 'g'); while((m = g.exec(t))){ const p = fn(m); if(p) found.push({ i: m.index, len: m[0].length, p: Object.assign(p, { raw: m[0] }) }); if(!m[0].length) g.lastIndex++; } };
  const monthAlt = MONTHS.map(x => x[1]).join('|'), monthShort = MONTHS.map(x => x[2]).join('|');
  const YEAR = '(25\\d\\d|20[1-4]\\d|[6-9]\\d)(?!\\d)';
  const monthNo = s => { for(const [n, full, short] of MONTHS){ if(new RegExp('^(?:' + full + '|' + short + ')$').test(s)) return n; } return 0; };
  const guessYear = (m, d) => (m > cm || (m === cm && d && d > cd)) ? cy - 1 : cy;   // เดือน/วันที่ยังมาไม่ถึง = ของปีที่แล้ว
  // วันที่ + เดือน (+ปี): "5 ต.ค." "วันที่ 5 ตุลา 69"
  add('(?:วันที่\\s*)?(\\d{1,2})\\s*((?:' + monthAlt + ')|(?:' + monthShort + ')(?![ก-๙]))\\s*(?:(?:พ\\.ศ\\.|ปี)\\s*)?(?:' + YEAR + ')?', m => {
    const mo = monthNo(m[2]), d = Number(m[1]); if(!mo || d < 1 || d > 31) return null;
    const y = yearFrom(m[3]) || guessYear(mo, d);
    const s = dateOf(y, mo, d); return dayPeriod(s);
  });
  // เดือน (+ปี): "ตุลา" "ต.ค. 69" "เดือนกันยา" "เดือน ตค"
  add('(?:เดือน\\s*)?(' + monthAlt + ')\\s*(?:(?:พ\\.ศ\\.|ปี)\\s*)?(?:' + YEAR + ')?', m => {
    const mo = monthNo(m[1]); if(!mo) return null;
    const y = yearFrom(m[2]) || guessYear(mo); return monthPeriod(y, mo);
  });
  add('เดือน\\s*(' + monthShort + ')(?![ก-๙])', m => { const mo = monthNo(m[1]); return mo ? monthPeriod(guessYear(mo), mo) : null; });
  add('(\\d{1,2})\\s*/\\s*(\\d{1,2})(?:\\s*/\\s*' + YEAR + ')?', m => {
    const d = Number(m[1]), mo = Number(m[2]); if(d < 1 || d > 31 || mo < 1 || mo > 12) return null;
    return dayPeriod(dateOf(yearFrom(m[3]) || guessYear(mo, d), mo, d));
  });
  add('(\\d{4})-(\\d{1,2})-(\\d{1,2})', m => dayPeriod(dateOf(Number(m[1]), Number(m[2]), Number(m[3]))));
  add('วันที่\\s*(\\d{1,2})(?!\\s*[/\\d])', m => {
    const d = Number(m[1]); if(d < 1 || d > 31) return null;
    return d > cd ? dayPeriod(dateOf(cy, cm - 1, d)) : dayPeriod(dateOf(cy, cm, d));
  });
  add('เมื่อวานซืน', () => dayPeriod(daysAgoStr(2), 'เมื่อวานซืน (' + thaiDate(daysAgoStr(2)) + ')'));
  add('เมื่อวาน(?!ซืน)', () => dayPeriod(daysAgoStr(1), 'เมื่อวาน (' + thaiDate(daysAgoStr(1)) + ')'));
  add('วันนี้', () => dayPeriod(today, 'วันนี้ (' + thaiDate(today) + ')'));
  add('(\\d{1,3})\\s*วัน\\s*(?:ก่อน|ที่แล้ว)', m => { const n = Number(m[1]); return dayPeriod(daysAgoStr(n), n + ' วันก่อน (' + thaiDate(daysAgoStr(n)) + ')'); });
  add('(?:ย้อนหลัง\\s*)?(\\d{1,3})\\s*วัน(?:\\s*(?:ล่าสุด|หลังสุด|ย้อนหลัง|ที่ผ่านมา))?(?!\\s*(?:ก่อน|ที่แล้ว))', m => {
    const n = Number(m[1]); if(n < 1) return null;
    return { from: daysAgoStr(n - 1), to: today, label: n + ' วันล่าสุด', kind: 'days', n };
  });
  add('วัน\\s*(อาทิตย์|จันทร์|อังคาร|พุธ|พฤหัสบดี|พฤหัส|ศุกร์|เสาร์)(\\s*(?:ที่แล้ว|ก่อน))?', m => {
    let back = (now.getDay() - WEEKDAYS[m[1]] + 7) % 7; if(m[2]) back += 7;
    return dayPeriod(daysAgoStr(back), 'วัน' + m[1] + (m[2] ? 'ที่แล้ว' : '') + ' (' + thaiDate(daysAgoStr(back)) + ')');
  });
  add('(?:อาทิตย์|สัปดาห์|วีค)\\s*(?:ก่อน|ที่แล้ว)', () => ({ from: daysAgoStr(13), to: daysAgoStr(7), label: '7 วันก่อนหน้า', kind: 'days', n: 7 }));
  add('(?:อาทิตย์|สัปดาห์|วีค)\\s*นี้|(?<!วัน)(?:อาทิตย์|สัปดาห์)(?!\\s*(?:ก่อน|ที่แล้ว))', () => ({ from: daysAgoStr(6), to: today, label: '7 วันล่าสุด', kind: 'days', n: 7 }));
  add('(\\d{1,2})\\s*เดือน\\s*(?:ล่าสุด|ที่ผ่านมา|ย้อนหลัง)', m => { const n = Number(m[1]); return { from: dateOf(cy, cm - n + 1, 1), to: today, label: n + ' เดือนล่าสุด', kind: 'range' }; });
  add('เดือน\\s*นี้', () => Object.assign(monthPeriod(cy, cm), { label: 'เดือนนี้ (' + MON_TH[cm-1] + ')' }));
  add('เดือน\\s*(?:ก่อน|ที่แล้ว)', () => { const d = new Date(cy, cm - 2, 1); return monthPeriod(d.getFullYear(), d.getMonth() + 1); });
  add('ปี\\s*นี้', () => ({ from: dateOf(cy, 1, 1), to: today, label: 'ปีนี้ (' + (cy + 543) + ')', kind: 'year' }));
  add('ปี\\s*(?:ก่อน|ที่แล้ว)', () => ({ from: dateOf(cy - 1, 1, 1), to: dateOf(cy - 1, 12, 31), label: 'ปี ' + (cy + 542), kind: 'year' }));
  add('ปี\\s*(?:พ\\.ศ\\.\\s*)?(\\d{2,4})', m => { const y = yearFrom(m[1]); return y ? { from: dateOf(y, 1, 1), to: dateOf(y, 12, 31), label: 'ปี ' + (y + 543), kind: 'year' } : null; });
  add('ทั้งหมด|ตั้งแต่ต้น|ตั้งแต่เปิด|รวมทุก|ทุกวัน', () => ({ from: '0000-00-00', to: '9999-99-99', label: 'ทั้งหมด', kind: 'all' }));
  // ตัดช่วงที่ซ้อนกัน (เก็บอันที่ยาวกว่า/มาก่อน)
  found.sort((a, b) => a.i - b.i || b.len - a.len);
  const keep = [];
  for(const f of found){ const last = keep[keep.length - 1]; if(last && f.i < last.i + last.len){ if(f.len > last.len && f.i === last.i) keep[keep.length - 1] = f; continue; } keep.push(f); }
  let rest = t;
  for(const f of [...keep].sort((a, b) => b.i - a.i)) rest = rest.slice(0, f.i) + ' ' + rest.slice(f.i + f.len);
  return { periods: keep.map(f => f.p), rest };
}

const NUM = '(\\d+(?:\\.\\d+)?)';
function parseAmount(rest){
  let m;
  if((m = rest.match(new RegExp('(?:ระหว่าง\\s*)?' + NUM + '\\s*(?:-|–|ถึง)\\s*' + NUM)))) { const a = Number(m[1]), b = Number(m[2]); return { min: Math.min(a, b), max: Math.max(a, b), raw: m[0] }; }
  if((m = rest.match(new RegExp('(?:ไม่เกิน|น้อยกว่า|ต่ำกว่า|ไม่ถึง|<=?|≤)\\s*' + NUM))) || (m = rest.match(new RegExp(NUM + '\\s*(?:บาท\\s*)?ลงมา')))) return { max: Number(m[1]), strictMax: !/ไม่เกิน|<=|≤|ลงมา/.test(m[0]), raw: m[0] };
  if((m = rest.match(new RegExp('(?:เกิน|มากกว่า|สูงกว่า|ตั้งแต่|อย่างน้อย|>=?|≥)\\s*' + NUM))) || (m = rest.match(new RegExp(NUM + '\\s*(?:บาท\\s*)?(?:ขึ้นไป|up)')))) return { min: Number(m[1]), strictMin: /เกิน|มากกว่า|สูงกว่า|>(?!=)/.test(m[0]), raw: m[0] };
  if((m = rest.match(new RegExp(NUM)))) { const v = Number(m[1]); if(v > 0) return { eq: v, raw: m[0] }; }
  return null;
}
function amtOk(r, a){
  const v = Number(r.amount) || 0;
  if(a.eq != null) return Math.abs(v - a.eq) < 0.005;
  if(a.min != null && (a.strictMin ? v <= a.min : v < a.min)) return false;
  if(a.max != null && (a.strictMax ? v >= a.max : v > a.max)) return false;
  return true;
}
function amtLabel(a){

}
// คำทั่วไปในคำถาม — ไม่ใช่ชื่อลูกค้า (ใช้ตัดทิ้งตอนหาชื่อที่พิมพ์ผิด และกันคำในชื่อชนคำถาม)
const VOCAB = ('ยอดเงิน ยอด โอนเข้า โอนออก โอน เงินเข้า เข้า ออก มาแล้ว มา กี่ครั้ง กี่รายการ กี่รอบ กี่คน กี่ ครั้ง รายการ เท่าไหร่ เท่าไร เท่าไห ได้ ไหม มั้ย ไม๊ ยัง บ้าง ของ คน ใคร วัน เดือน ปี นี้ ก่อน ที่แล้ว แล้ว ล่ะ ละ หน่อย ครับ ค่ะ คะ นะ จ้า จ้ะ ขอ ดู เช็ค เช็ก หา ค้นหา ลูกค้า รวม ทั้งหมด สรุป บาท เงิน ธนาคาร แบงก์ แบงค์ สลิป ช่วย ด้วย มี เป็น อะไร ยังไง ไหน สูงสุด ต่ำสุด มากสุด เยอะสุด น้อยสุด สุด เฉลี่ย เกิน กว่า ขาย ขายดี ดี ร้าน ทำ ให้ ที่ และ กับ หรือ บันทึก พนักงาน เจ้าของ ล่าสุด เทียบ ยืนยัน ตรวจ ซ้ำ รอบ อนุมัติ รอ เป้า กำไร จ่าย ค่า ใช้ ตอนนี้ วันนี้ เมื่อวาน นาย นาง นางสาว คุณ บจก หจก บริษัท จำกัด ไม่ระบุชื่อ ไม่ระบุ อ่ะ อะ เลย จริง').split(' ');
const VOCAB_SET = new Set(VOCAB);
const VOCAB_RE = new RegExp(VOCAB.slice().sort((a, b) => b.length - a.length).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'g');
function nameTokens(n){ return String(n || '').toLowerCase().split(/[\s()\-.,/]+/).filter(tk => tk.length >= 3 && !/^\d+$/.test(tk) && !VOCAB_SET.has(tk)); }
function osa(a, b){   // ระยะแก้คำ (นับสลับตัวอักษรติดกันเป็น 1) — จับชื่อพิมพ์ผิด เช่น สมชยา → สมชาย
  const d = []; for(let i = 0; i <= a.length; i++){ d[i] = [i]; } for(let j = 0; j <= b.length; j++) d[0][j] = j;
  for(let i = 1; i <= a.length; i++) for(let j = 1; j <= b.length; j++){
    const c = a[i-1] === b[j-1] ? 0 : 1;
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + c);
    if(i > 1 && j > 1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]) d[i][j] = Math.min(d[i][j], d[i-2][j-2] + 1);
  }
  return d[a.length][b.length];
}
function findCustomers(t, rest){
  const names = [...new Set(data.map(r => (r.name || '').trim()).filter(n => n && n !== 'ไม่ระบุชื่อ'))];
  const lower = n => n.toLowerCase();
  // 1) ชื่อเต็มอยู่ในประโยค
  let hits = names.filter(n => n.length >= 3 && t.includes(lower(n)));
  if(hits.length) return { names: hits };
  // 2) คำใดคำหนึ่งของชื่ออยู่ในประโยค เช่น "สมชาย" → "สมชาย ใจดี"
  hits = names.filter(n => nameTokens(n).some(tk => t.includes(tk)));
  if(hits.length) return { names: hits };
  // 3) พิมพ์ผิดเล็กน้อย — เทียบกับคำที่เหลือหลังตัดคำทั่วไป/ตัวเลข/วันที่ออก
  const chunks = rest.replace(VOCAB_RE, ' ').replace(/[\d.,:;!?()"'\-–/]+/g, ' ').split(/\s+/).filter(c => (c.match(/[ก-๙a-z]/g) || []).length >= 3);
  let best = null;
  for(const n of names) for(const tk of nameTokens(n)){
    const thr = tk.length >= 6 ? 2 : 1;
    for(const c of chunks) for(let L = Math.max(3, tk.length - 1); L <= tk.length + 1; L++) for(let s = 0; s + L <= c.length; s++){
      const dist = osa(c.slice(s, s + L), tk);
      if(dist <= thr && (!best || dist < best.dist)) best = { dist, tk };
    }
  }
  if(best){ const ns = names.filter(n => nameTokens(n).includes(best.tk)); return { names: ns, guessed: true }; }
  return null;
}

function parseQuery(text){
  let t = String(text || '').toLowerCase()
    .replace(/[๐-๙]/g, c => String(c.charCodeAt(0) - 0x0E50))
    .replace(/(\d),(?=\d{3}(?!\d))/g, '$1')
    .replace(/(\d+(?:\.\d+)?)\s*(?:k|พัน)(?![ก-๙])/g, (m, n) => String(Number(n) * 1000))
    .replace(/(\d+(?:\.\d+)?)\s*หมื่น/g, (m, n) => String(Number(n) * 10000))
    .replace(/\s+/g, ' ').trim();
  const q = { text: t, f: {} };
  const P = parsePeriods(t);
  q.periods = P.periods;
  let rest = P.rest;
  // จำนวนอันดับ/รายการที่ขอ (ไม่ใช่ยอดเงิน): "top 5" "5 อันดับ" "ล่าสุด 10 รายการ" ; "2 รอบ" "3 ครั้ง"
  let m;
  if((m = rest.match(/top\s*(\d{1,2})|(\d{1,2})\s*(?:อันดับ|คนแรก)|(?:ล่าสุด|แรก)\s*(\d{1,2})|(\d{1,2})\s*รายการ\s*(?:ล่าสุด|แรก)/))){ q.topN = Number(m[1] || m[2] || m[3] || m[4]); rest = rest.replace(m[0], ' '); }
  if((m = rest.match(/(\d)\s*(?:รอบ|ครั้ง|ที)(?![ก-๙])/))){ q.times = Number(m[1]); rest = rest.replace(m[0], ' '); }
  if(q.periods.length) q.f.period = q.periods[0];
  // ธนาคาร
  for(const [re, name] of BANKS) if(re.test(t)){ q.f.bank = name; rest = rest.replace(re, ' '); break; }
  // ประเภท
  if(/จ่ายออก|ค่าใช้จ่าย|รายจ่าย|โอนออก|จ่ายไป|ใช้จ่าย|ใช้ไป/.test(t)) q.f.type = 'out';
  else if(/เงินเข้า|รับเข้า|รายรับ|โอนเข้า|รายได้|ขายได้|ยอดขาย/.test(t)) q.f.type = 'in';
  // สถานะสลิป
  if(/ยังไม่ตรวจ|ไม่ได้ตรวจ|ไม่ผ่าน|ไม่มีสลิป|กรอกเอง|ยังไม่ยืนยัน|ค้างตรวจ/.test(t)) q.f.verified = false;
  else if(/ยืนยันแล้ว|ตรวจแล้ว|ผ่านแล้ว|ยืนยันธนาคาร|verified/.test(t)) q.f.verified = true;
  // คนบันทึก
  if(/บันทึก|พนักงาน|คีย์|ลงยอด/.test(t)){
    const emails = [...new Set(data.map(recorderOf).filter(Boolean))];
    const hit = emails.find(e => { const l = whoLabel(e).toLowerCase(); return l && t.includes(l); });
    if(hit) { q.f.recorder = hit; rest = rest.replace(whoLabel(hit).toLowerCase(), ' '); }
  }
  // ยอดเงิน (หลังตัดวันที่/อันดับออกแล้ว ตัวเลขที่เหลือคือยอด)
  const a = parseAmount(rest);
  if(a){ q.f.amount = a; rest = rest.replace(a.raw, ' '); }
  // ลูกค้า
  const explicit = t.match(/(?:ค้นหา|หาชื่อ|ชื่อ|ลูกค้าชื่อ)\s*[:：]?\s*(\S.*)$/);
  const c = findCustomers(t, rest);
  if(c) q.f.cust = c;
  if(c && c.names.length && q.periods.length){   // ชื่อลูกค้าชนชื่อเดือน เช่น "มีนา" → ถือเป็นชื่อ (พิมพ์ "เดือนมีนา" ถ้าหมายถึงเดือน)
    const nm = c.names.map(n => n.toLowerCase());
    q.periods = q.periods.filter(p => !(p.raw && !/เดือน|\d/.test(p.raw) && nm.some(n => n.includes(p.raw.trim()))));
    if(q.periods.length) q.f.period = q.periods[0]; else delete q.f.period;
  }
  if(!c && explicit && explicit[1].trim().length >= 2) q.f.cust = { names: [], text: explicit[1].trim() };
  q.intent = detectIntent(t, P.rest);
  q.follow = /^(?:แล้ว|ส่วน|งั้น|และ)/.test(t) || /(?:ล่ะ|ละ|หล่ะ|หละ)\s*[?]?$/.test(t);
  return q;
}
function detectIntent(t, rest){
  if(/ช่วยเหลือ|ทำอะไรได้|help|วิธีใช้|ใช้ยังไง|ถามอะไรได้/.test(t)) return 'help';
  if(/^(?:สวัสดี|หวัดดี|ดีครับ|ดีค่ะ|hello|hi)/.test(t)) return 'greet';
  if(/^(?:ขอบคุณ|ขอบใจ|thank|โอเค|ok)/.test(t)) return 'thanks';
  if(/รออนุมัติ|คิวอนุมัติ|คิวรอ|รอตรวจ|ค้างอนุมัติ/.test(t)) return 'pending';
  if(/เป้า/.test(t)) return 'goal';
  if(/ดูสลิป|ขอสลิป|เปิดสลิป|รูปสลิป|ขอดูรูป/.test(t)) return 'slips';
  if(/ซ้ำ|สองรอบ|สองครั้ง|\d\s*รอบ|\d\s*ครั้งในวัน/.test(t)) return 'dup';
  if(/เทียบ|เปรียบเทียบ|เยอะกว่า|มากกว่า(?!\s*\d)|น้อยกว่า(?!\s*\d)|ดีกว่า|แย่กว่า|โตขึ้น|ตกลง|ลดลง|เพิ่มขึ้น/.test(t)) return 'compare';
  if(/วันไหน|วันที่ขาย|ขายดีสุด|ขายดีที่สุด|ขายน้อยสุด|ขายไม่ดี/.test(t)) return /น้อย|ต่ำ|แย่|เงียบ|ไม่ดี/.test(t) ? 'worstDay' : 'bestDay';
  if(/เฉลี่ย/.test(t)) return 'avg';
  if(/กำไร|ขาดทุน/.test(t)) return 'profit';
  if(/ใคร(?:เป็นคน)?(?:บันทึก|คีย์)|แยก(?:ตาม)?พนักงาน|พนักงาน(?:คนไหน|ใคร)|บันทึก.*(?:เยอะ|มาก|บ่อย)สุด/.test(t)) return 'byRecorder';
  if(/ลูกค้าประจำ|ขาประจำ|โอนบ่อย|บ่อยสุด|ใคร.*(?:เยอะ|มาก|สูง)สุด|ลูกค้า.*(?:เยอะ|มาก|ใหญ่)สุด|top.*ลูกค้า|ลูกค้า.*top/.test(t)) return /บ่อย|ประจำ|ครั้ง/.test(t) ? 'topCustCount' : 'topCustSum';
  if(/แยก(?:ตาม)?(?:ธนาคาร|แบงก์|แบงค์)|ธนาคารไหน|แต่ละธนาคาร|แยกแบงก์/.test(t)) return 'byBank';
  if(/ยอดสูงสุด|รายการ(?:ใหญ่|สูง)สุด|มากสุด|สูงสุด|ใหญ่สุด|\btop\b/.test(t)) return 'topTx';
  if(/ยังไม่ตรวจ|ไม่ได้ตรวจ|ไม่ผ่าน|ไม่มีสลิป|ค้างตรวจ/.test(t)) return 'list';
  if(/ล่าสุด|เพิ่งเข้า|เมื่อกี้|รายการใหม่/.test(rest)) return 'latest';
  if(/กี่คน/.test(t)) return 'countPeople';
  if(/กี่ครั้ง|กี่รายการ|กี่รอบ|กี่ที|จำนวนรายการ/.test(t)) return 'count';
  if(/สรุป|ภาพรวม|overview|เป็นไงบ้าง|โดยรวม|dashboard/.test(t)) return 'overview';
  if(/ขอดู|มีใครบ้าง|ใครบ้าง|ใคร(?:โอน|จ่าย)|ลิสต์|list|แสดง|รายการ/.test(t)) return 'list';
  if(/ยอด|เท่าไหร่|เท่าไร|ได้กี่|รวม|เข้ายัง|เข้าไหม|มีไหม|มีมั้ย|เช็ค|เช็ก|หา/.test(t)) return 'sum';
  return null;
}

/* ── คำนวณ ── */
function applyFilters(f, opt){
  opt = opt || {};
  return data.filter(r => {
    const p = opt.period || f.period;
    if(p && !(r.date >= p.from && r.date <= p.to)) return false;
    if(f.type === 'out' && !isOut(r)) return false;
    if(f.type === 'in' && isOut(r)) return false;
    if(f.bank && r.bank !== f.bank) return false;
    if(f.amount && !amtOk(r, f.amount)) return false;
    if(f.verified === true && !r.slipVerified) return false;
    if(f.verified === false && (r.slipVerified || isOut(r))) return false;
    if(f.recorder && recorderOf(r).toLowerCase() !== f.recorder.toLowerCase()) return false;
    if(f.cust){
      if(f.cust.names.length){ if(!f.cust.names.includes((r.name || '').trim())) return false; }
      else { const q = f.cust.text.toLowerCase(); if(!((r.name || '').toLowerCase().includes(q) || (r.note || '').toLowerCase().includes(q))) return false; }
    }
    return true;
  });
}
function filterLabel(f, noPeriod){
  const parts = [];
  if(f.cust) parts.push(f.cust.names.length ? (f.cust.names.length <= 2 ? f.cust.names.join(', ') : f.cust.names.length + ' ชื่อที่ตรง') : '"' + f.cust.text + '"');
  if(f.type === 'out') parts.push('จ่ายออก'); else if(f.type === 'in') parts.push('รับเข้า');
  if(f.bank) parts.push(f.bank);
  if(f.amount) parts.push(amtLabel(f.amount));
  if(f.verified === true) parts.push('ยืนยันธนาคารแล้ว'); else if(f.verified === false) parts.push('ยังไม่ตรวจสลิป');
  if(f.recorder) parts.push('บันทึกโดย ' + whoLabel(f.recorder));
  if(!noPeriod) parts.push(f.period ? f.period.label : 'ทุกช่วงเวลา');
  return parts.join(' · ');
}
const specific = f => !!(f.cust || f.bank || f.amount || f.verified != null || f.recorder);
const LEGEND = '\n\n✅ = ยืนยันกับธนาคารแล้ว · 📎 = มีสลิป · 📝 = กรอกเอง';
function listLines(list, n){ const s = sortRecent(list); return s.slice(0, n).map(recLine).join('\n') + (s.length > n ? '\n...และอีก ' + (s.length - n) + ' รายการ' : ''); }
function guessNote(f){ return f.cust && f.cust.guessed ? '🔎 น่าจะหมายถึง "' + f.cust.names.slice(0, 3).join('", "') + '" นะคะ\n\n' : ''; }
function defaultPeriod(f, label){ return f.period || Object.assign(monthPeriod(new Date().getFullYear(), new Date().getMonth() + 1), { label: label || ('เดือนนี้ (' + MON_TH[new Date().getMonth()] + ')') }); }
function prevPeriod(p){
  const span = daysBetween(p.from, p.to) + 1;
  if(p.kind === 'month'){ const [y, m] = p.from.split('-').map(Number); const d = new Date(y, m - 2, 1); return monthPeriod(d.getFullYear(), d.getMonth() + 1); }
  if(p.kind === 'year'){ const y = Number(p.from.slice(0, 4)) - 1; return { from: dateOf(y, 1, 1), to: dateOf(y, 12, 31), label: 'ปี ' + (y + 543), kind: 'year' }; }
  if(p.kind === 'day') return dayPeriod(addDays(p.from, -1));
  return { from: addDays(p.from, -span), to: addDays(p.from, -1), label: span + ' วันก่อนหน้า', kind: 'days', n: span };
}

function answer(q){

    case 'greet':
      return 'สวัสดีค่ะ 🙏 น้องเฮิร์ตพร้อมช่วยเช็คยอดแล้วค่ะ\nตอนนี้มี ' + data.length + ' รายการในระบบ ยอดคงเหลือสุทธิ ' + fmt(sum(data)) + ' ฿\nพิมพ์ "ช่วยเหลือ" เพื่อดูตัวอย่างคำถามนะคะ';
    case 'thanks': return 'ยินดีค่ะ 💙';
    case 'pending': {
      const list = [...pendingData].sort((a, b) => (b.submittedAt || 0) - (a.submittedAt || 0));
      if(!list.length) return '✅ ไม่มีรายการรออนุมัติค่ะ';
      const tot = list.reduce((s, x) => s + (Number(x.amount) || 0), 0);
      return '🕒 รออนุมัติ ' + list.length + ' รายการ (รวม ' + fmt(tot) + ' ฿):\n\n' +
        list.slice(0, 8).map(x => '• ' + fmt(x.amount) + ' ฿ — ' + _noSent(x.name || 'ไม่ระบุชื่อ') + ' · ' + thaiDate(x.date) + ' · ส่งโดย ' + (whoLabel(x.submittedBy) || '-')).join('\n') +
        (list.length > 8 ? '\n...และอีก ' + (list.length - 8) + ' รายการ' : '') + '\n\nอนุมัติได้ที่หน้าแรกค่ะ';
    }
    case 'goal': {
      if(!goalAmt) return '🎯 ยังไม่ได้ตั้งเป้ายอดเดือนนี้ค่ะ\nเจ้าของตั้งได้ที่การ์ด "เป้ายอดเดือนนี้" ในหน้าแรกนะคะ';
      const now = new Date(), ym = today.slice(0, 7);

    }
    case 'slips': {
      let list = applyFilters(f).filter(r => r.slipVerified || r.hasImg);
      if(!list.length) return guessNote(f) + (specific(f) || f.period ? '🔍 ไม่พบสลิป (' + filterLabel(f) + ') ค่ะ' : '📭 ยังไม่มีรายการที่มีสลิปเก็บไว้ค่ะ');
      return guessNote(f) + '📎 รายการที่มีสลิป (' + filterLabel(f) + ') ' + list.length + ' รายการ — กดปุ่มดูสลิปได้เลยค่ะ:\n\n' + listLines(list, 8);
    }
    case 'dup': {
      const need = q.times && q.times >= 2 ? q.times : 2;

        groups.slice(0, 6).map(x => '• ' + thaiDate(x[0].date) + ' · ' + _noSent(x[0].name || 'ไม่ระบุชื่อ') + ' · ' + fmt(x[0].amount) + ' ฿ × ' + x.length + ' รอบ\n' + x.map(r => '    ' + recLine(r)).join('\n')).join('\n');

    case 'compare': {

      const p2 = q.periods[1] || prevPeriod(p1);

      const a = applyFilters(base, { period: p1 }), b = applyFilters(base, { period: p2 });
      const va = base.type === 'out' ? sumOut(a) : sumIn(a), vb = base.type === 'out' ? sumOut(b) : sumIn(b);
      const diff = va - vb, pct = vb > 0 ? Math.round(Math.abs(diff) / vb * 100) : null;
      const arrow = diff > 0 ? '📈 เพิ่มขึ้น' : (diff < 0 ? '📉 ลดลง' : '➡️ เท่าเดิม');
      const what = (base.type === 'out' ? 'จ่ายออก' : 'รับเข้า') + (specific(f) ? ' · ' + filterLabel(f, true) : '');
      let s = guessNote(f) + '⚖️ เทียบ' + what + '\n\n• ' + p1.label + ': ' + fmt(va) + ' ฿ (' + a.length + ' รายการ)\n• ' + p2.label + ': ' + fmt(vb) + ' ฿ (' + b.length + ' รายการ)\n\n' + arrow + ' ' + fmt(Math.abs(diff)) + ' ฿' + (pct != null ? ' (' + pct + '%)' : '');
      if(p1.to >= today && p1.kind === 'month' && p2.kind === 'month') s += '\n(เดือนนี้ยังไม่จบ — เทียบกับทั้งเดือนก่อน)';
      return s;
    }
    case 'bestDay': case 'worstDay': {
      const p = defaultPeriod(f);
      const list = applyFilters(Object.assign({}, f, { type: 'in' }), { period: p });
      const byDay = {}; list.forEach(r => { byDay[r.date] = (byDay[r.date] || 0) + Number(r.amount || 0); });
      let rows;
      if(q.intent === 'worstDay'){
        const days = []; const first = p.kind === 'all' ? (sortRecent(data).pop() || {}).date || today : p.from;
        for(let d = first; d <= (p.to < today ? p.to : today); d = addDays(d, 1)) days.push(d);
        if(!days.length) return empty(p.label);
        rows = days.map(d => [d, byDay[d] || 0]).sort((x, y) => x[1] - y[1] || y[0].localeCompare(x[0])).slice(0, q.topN || 3);
      } else {
        rows = Object.entries(byDay).sort((x, y) => y[1] - x[1]).slice(0, q.topN || 3);
        if(!rows.length) return guessNote(f) + empty(filterLabel(f, true) ? filterLabel(f, true) + ' · ' + p.label : p.label);
      }
      const title = (q.intent === 'worstDay' ? '🐢 วันที่ขายน้อยสุด' : '🏆 วันที่ขายดีสุด') + ' (' + (specific(f) ? filterLabel(f, true) + ' · ' : '') + p.label + ')';
      return guessNote(f) + title + ':\n\n' + rows.map(([d, v], i) => (i + 1) + '. ' + thaiDate(d) + ' — ' + fmt(v) + ' ฿ (' + list.filter(r => r.date === d).length + ' รายการ)').join('\n') +
        (f.period ? '' : '\n\nถามช่วงอื่นได้ เช่น "วันไหนขายดีสุดเดือนก่อน"');
    }
    case 'avg': {
      const p = defaultPeriod(f);
      const list = applyFilters(Object.assign({}, f, { type: f.type || 'in' }), { period: p });
      if(!list.length) return guessNote(f) + empty(p.label);
      const first = p.kind === 'all' ? sortRecent(data).pop().date : p.from;
      const nDays = Math.max(1, daysBetween(first, p.to < today ? p.to : today) + 1);
      const tot = f.type === 'out' ? sumOut(list) : sumIn(list);
      return guessNote(f) + '📐 ค่าเฉลี่ย' + (f.type === 'out' ? 'จ่ายออก' : 'รับเข้า') + ' (' + (specific(f) ? filterLabel(f, true) + ' · ' : '') + p.label + ')\n\n• ต่อวัน: ' + fmt(Math.round(tot / nDays)) + ' ฿ (' + nDays + ' วัน)\n• ต่อรายการ: ' + fmt(Math.round(tot / list.length)) + ' ฿ (' + list.length + ' รายการ)\n• รวม: ' + fmt(tot) + ' ฿';
    }
    case 'profit': {

      const list = applyFilters(base, { period: p });
      const i = sumIn(list), o = sumOut(list), net = i - o;
      return '💹 กำไรคร่าว ๆ (' + p.label + ')\n\n• รับเข้า: ' + fmt(i) + ' ฿\n• จ่ายออก: −' + fmt(o) + ' ฿\n• ' + (net >= 0 ? 'กำไร' : 'ขาดทุน') + ': ' + fmt(Math.abs(net)) + ' ฿' + (i > 0 ? ' (' + Math.round(net / i * 100) + '% ของรายรับ)' : '') +
        '\n\n(คิดจากเงินเข้า−ออกที่บันทึกในระบบเท่านั้น ไม่รวมต้นทุนที่ไม่ได้บันทึกนะคะ)';
    }
    case 'byRecorder': {
      const list = applyFilters(f);
      if(!list.length) return empty(filterLabel(f));
      const g = {};
      list.forEach(r => { const k = whoLabel(recorderOf(r)) || '(ไม่ทราบ — รายการเก่า)'; g[k] = g[k] || { n: 0, s: 0 }; g[k].n++; g[k].s += Number(r.amount || 0); });
      return '👥 แยกตามคนบันทึก (' + filterLabel(f) + '):\n\n' + Object.entries(g).sort((a, b) => b[1].n - a[1].n).map(([k, v], i) => (i + 1) + '. ' + k + ' — ' + v.n + ' รายการ (' + fmt(v.s) + ' ฿)').join('\n');
    }
    case 'topCustCount': case 'topCustSum': {
      const list = applyFilters(Object.assign({}, f, { type: 'in' }));
      if(!list.length) return empty(filterLabel(f));
      const g = {};
      list.forEach(r => { const n = r.name || 'ไม่ระบุ'; g[n] = g[n] || { n: 0, s: 0 }; g[n].n++; g[n].s += Number(r.amount || 0); });
      const bySum = q.intent === 'topCustSum';
      const rows = Object.entries(g).sort((a, b) => bySum ? (b[1].s - a[1].s || b[1].n - a[1].n) : (b[1].n - a[1].n || b[1].s - a[1].s)).slice(0, q.topN || 5);
      return (bySum ? '💰 ลูกค้าที่โอนยอดรวมสูงสุด' : '⭐ ลูกค้าที่โอนบ่อยสุด') + ' (' + filterLabel(f) + '):\n\n' + rows.map(([n, v], i) => (i + 1) + '. ' + _noSent(n) + ' — ' + v.n + ' ครั้ง (รวม ' + fmt(v.s) + ' ฿)').join('\n');
    }
    case 'byBank': {
      const list = applyFilters(Object.assign({}, f, { type: f.type || 'in' }));
      if(!list.length) return empty(filterLabel(f));
      const g = {}; list.forEach(r => { const b = r.bank || 'ไม่ระบุ'; g[b] = g[b] || { n: 0, s: 0 }; g[b].n++; g[b].s += Number(r.amount || 0); });
      const tot = list.reduce((s, r) => s + Number(r.amount || 0), 0) || 1;
      return '🏦 ' + (f.type === 'out' ? 'จ่ายออก' : 'รับเข้า') + 'แยกตามธนาคาร (' + filterLabel(f) + '):\n\n' + Object.entries(g).sort((a, b) => b[1].s - a[1].s).map(([b, v]) => '• ' + b + ': ' + fmt(v.s) + ' ฿ · ' + v.n + ' รายการ (' + Math.round(v.s / tot * 100) + '%)').join('\n');
    }
    case 'topTx': {
      const list = applyFilters(Object.assign({}, f, { type: f.type || 'in' })).sort((a, b) => Number(b.amount || 0) - Number(a.amount || 0));
      if(!list.length) return guessNote(f) + empty(filterLabel(f));
      const n = q.topN || 3;
      return guessNote(f) + '🏆 ' + (f.type === 'out' ? 'จ่ายออก' : 'ยอดโอนเข้า') + 'สูงสุด ' + Math.min(n, list.length) + ' อันดับ (' + filterLabel(f) + '):\n\n' + list.slice(0, n).map((r, i) => (i + 1) + '. ' + recLine(r)).join('\n');
    }
    case 'latest': {
      const list = applyFilters(f);
      if(!list.length) return guessNote(f) + empty(filterLabel(f));
      return guessNote(f) + '🕐 ' + Math.min(q.topN || 5, list.length) + ' รายการล่าสุด' + (specific(f) || f.period ? ' (' + filterLabel(f) + ')' : '') + ':\n\n' + listLines(list, q.topN || 5);
    }
    case 'countPeople': {
      const list = applyFilters(Object.assign({}, f, { type: f.type || 'in' }));
      const n = new Set(list.map(r => r.name || 'ไม่ระบุ')).size;
      return '👥 ' + filterLabel(f) + ': ลูกค้า ' + n + ' คน · ' + list.length + ' รายการ · รวม ' + fmt(sumIn(list) || sumOut(list)) + ' ฿';
    }
    case 'count': {
      const list = applyFilters(f);
      if(!list.length) return guessNote(f) + empty(filterLabel(f));
      const nIn = list.filter(r => !isOut(r)).length, nOut = list.length - nIn;
      const lastR = sortRecent(list)[0];
      return guessNote(f) + '🔢 ' + filterLabel(f) + '\n\n• ' + list.length + ' รายการ' + (nOut ? ' (รับเข้า ' + nIn + ' · จ่ายออก ' + nOut + ')' : '') +
        '\n• รวม ' + fmt(nOut && !nIn ? sumOut(list) : sumIn(list)) + ' ฿' + (f.cust ? '\n• ล่าสุด: ' + thaiDate(lastR.date) + ' (' + fmt(lastR.amount) + ' ฿)' : '') +
        (list.length <= 6 ? '\n\n' + listLines(list, 6) : '');
    }
    case 'overview':
      if(!specific(f) && !f.period){
        if(!data.length) return 'ยังไม่มีรายการในระบบเลยค่ะ';
        const tD = sum(filterRange(today, today)), t7 = sum(filterRange(daysAgoStr(6), today));
        const tM = sum(data.filter(r => (r.date || '').slice(0, 7) === monthStr(0)));
        const tAll = sum(data), oAll = sumOut(data);
        const custs = new Set(data.filter(r => !isOut(r)).map(r => r.name || 'ไม่ระบุ')).size;
        const inCount = data.filter(r => !isOut(r)).length, verified = data.filter(r => r.slipVerified).length;
        return '📋 สรุปภาพรวม HURT SHOP (ยอดสุทธิ = รับเข้า − จ่ายออก)\n\n' +
          '• วันนี้: ' + fmt(tD) + ' ฿\n• 7 วันล่าสุด: ' + fmt(t7) + ' ฿\n• เดือนนี้: ' + fmt(tM) + ' ฿\n' +
          '• คงเหลือทั้งหมด: ' + fmt(tAll) + ' ฿ (' + data.length + ' รายการ' + (oAll > 0 ? ' · จ่ายออกรวม −' + fmt(oAll) + ' ฿' : '') + ')\n' +
          '• ลูกค้า: ' + custs + ' ราย · เงินเข้าตรวจสลิปแล้ว ' + verified + '/' + inCount +
          (pendingData.length ? '\n• 🕒 รออนุมัติ ' + pendingData.length + ' รายการ' : '');
      }
      // มีเงื่อนไข → สรุปตามเงื่อนไข
    case 'sum': case 'list': {
      const list = applyFilters(f);
      const label = filterLabel(f);
      if(!list.length){
        if(f.amount && f.amount.eq != null && !f.period) return guessNote(f) + '🔍 ไม่พบยอดโอน ' + fmt(f.amount.eq) + ' ฿ ในระบบค่ะ\nลองเช็คจำนวนเงินอีกครั้ง หรือรายการอาจยังไม่ถูกบันทึกนะคะ';
        return guessNote(f) + empty(label);
      }
      if(f.amount && f.amount.eq != null){
        const nToday = list.filter(r => r.date === today).length;
        return guessNote(f) + '🔍 พบ' + amtLabel(f.amount) + ' ' + list.length + ' รายการ' + (nToday ? ' (วันนี้ ' + nToday + ' รายการ ✅)' : (f.period ? '' : ' (วันนี้ยังไม่มี)')) + ':\n\n' + listLines(list, 6) + LEGEND;
      }
      if(q.intent === 'list' || specific(f)) return guessNote(f) + summaryReply(list, label) + '\n\n' + listLines(list, q.intent === 'list' ? 10 : 6);
      if(f.type === 'out') return '💸 จ่ายออก (' + filterLabel(Object.assign({}, f, { type: null })) + ')\nรวม −' + fmt(sumOut(list)) + ' ฿ · ' + list.length + ' รายการ\n\n' + listLines(list, 8);
      return summaryReply(list, 'ยอด ' + label);
    }
  }
  return null;
}

function botReply(text){
  if(!ready) return 'ยังโหลดข้อมูลไม่เสร็จเลยค่ะ รอสักครู่แล้วถามใหม่นะคะ ⏳';
  const q = parseQuery(text);
  // ถามต่อ: "แล้วเดือนก่อนล่ะ" → ใช้เงื่อนไขเดิม เปลี่ยนเฉพาะส่วนที่พูดถึงใหม่
  if(q.follow && lastQ){
    q.f = Object.assign({}, lastQ.f, q.f);
    if(!q.periods.length && lastQ.periods) q.periods = lastQ.periods;
    if(!q.intent || q.intent === 'sum') q.intent = lastQ.intent || q.intent;
    if(q.topN == null) q.topN = lastQ.topN;
  }
  if(!q.intent && (Object.keys(q.f).length)) q.intent = 'sum';   // มีแต่เงื่อนไข เช่น "สมชายเดือนนี้" → สรุปตามเงื่อนไข
  const reply = q.intent ? answer(q) : null;
  if(reply){
    if(!['help', 'greet', 'thanks'].includes(q.intent)) lastQ = { f: q.f, periods: q.periods, intent: q.intent, topN: q.topN };
    return reply;
  }
  return 'ขออภัยค่ะ น้องเฮิร์ตยังไม่เข้าใจคำถามนี้ 🙏\nลองถามแบบนี้ดูนะคะ:\n• "สมชายเดือนนี้โอนกี่ครั้ง"\n• "590 เข้ายัง" / "ใครโอนเกิน 1000"\n• "วันไหนขายดีสุด" / "เทียบเดือน"\n• "ถึงเป้ายัง" / "รออนุมัติ"\nหรือพิมพ์ "ช่วยเหลือ" เพื่อดูทั้งหมดค่ะ';
}

/* ═══════════ โหมด AI (Claude ผ่าน Worker) ═══════════ */
const chatHistory = [];   // เก็บบทสนทนาไว้ให้ AI คุยต่อเนื่อง

// สรุปข้อมูลแบบกะทัดรัดส่งให้ AI (ยอดรวมช่วงต่าง ๆ + รายการล่าสุด)
function buildContext(){
  const today = todayStr();
  const lines = [];
  const agg = (list, label) => { const o = sumOut(list); return label + ': สุทธิ ' + fmt(sum(list)) + ' ฿ / ' + list.length + ' รายการ' + (o > 0 ? ' (จ่ายออก −' + fmt(o) + '฿)' : ''); };
  lines.push('วันนี้คือ ' + today + ' (' + thaiDate(today) + ')');
  lines.push(agg(filterRange(today, today), 'วันนี้'));
  lines.push(agg(filterRange(daysAgoStr(1), daysAgoStr(1)), 'เมื่อวาน'));
  lines.push(agg(filterRange(daysAgoStr(6), today), '7วันล่าสุด'));
  lines.push(agg(data.filter(r => (r.date||'').slice(0,7) === monthStr(0)), 'เดือนนี้'));
  lines.push(agg(data.filter(r => (r.date||'').slice(0,7) === monthStr(-1)), 'เดือนที่แล้ว'));
  lines.push(agg(data, 'ทั้งหมด'));
  const g = {};
  data.forEach(r => { const b = r.bank || 'ไม่ระบุ'; g[b] = (g[b]||0) + signedAmt(r); });
  lines.push('แยกธนาคาร (สุทธิ): ' + Object.entries(g).map(([b,s]) => b + '=' + fmt(s) + '฿').join(', '));
  const recent = sortRecent(data).slice(0, 200);
  lines.push('');
  lines.push('รายการ (ใหม่→เก่า, ' + recent.length + ' จาก ' + data.length + ' รายการ):');
  lines.push('รูปแบบ: วันที่ | ยอด(ลบ=จ่ายออก) | ชื่อ | ธนาคาร | สลิป | โน้ต');
  recent.forEach(r => {
    const slip = isOut(r) ? 'out' : (r.slipVerified ? 'verified' : (r.slipRef ? 'pending' : 'manual'));
    lines.push([r.date, signedAmt(r), r.name||'-', r.bank||'-', slip, r.note||''].join(' | '));
  });
  return lines.join('\n');
}

async function aiReply(text){
  const user = firebase.auth().currentUser;
  if(!user) throw new Error('no auth');
  const idToken = await user.getIdToken();
  const res = await fetch(AI_PROXY, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ idToken, question: text, context: buildContext(), history: chatHistory.slice(-8) })
  });
  const j = await res.json();
  if(!j.ok) throw new Error(j.error || 'ai error');
  return j.reply;
}

/* ripple ตอนแตะปุ่ม/เมนู */
document.addEventListener('pointerdown', function(e){
  const el = e.target.closest('#quick button, #inputbar button, .slipchip, #gBtn');
  if (!el) return;
  const r = el.getBoundingClientRect();
  const size = Math.max(r.width, r.height);
  const rip = document.createElement('span');
  rip.className = 'rip';
  rip.style.width = rip.style.height = size + 'px';
  rip.style.left = (e.clientX - r.left - size / 2) + 'px';
  rip.style.top = (e.clientY - r.top - size / 2) + 'px';

}, true);

function escHtml(s){ return (s||'').toString().replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c])); }
function addMsg(text, who){
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  if (who === 'bot' && /⟦slip:/.test(text)) {
    const parts = text.split(/⟦slip:([^⟧]+)⟧/);   // [ข้อความ, id, ข้อความ, id, ...]
    let html = '';
    for (let i = 0; i < parts.length; i++) {
      html += (i % 2 === 0) ? escHtml(parts[i]) : '<button class="slipchip" data-slip="' + escHtml(parts[i]) + '">👁️ ดูสลิป</button>';
    }
    d.innerHTML = html;
    d.querySelectorAll('.slipchip').forEach(b => b.onclick = () => openSlip(b.dataset.slip));
  } else {
    d.textContent = text;
  }
  chatEl.appendChild(d);
  chatEl.scrollTop = chatEl.scrollHeight;
}

let activeRoom = BAKED_ROOM;
async function openSlip(id){
  let box = document.getElementById('slipLightbox');
  if (!box) {
    box = document.createElement('div'); box.id = 'slipLightbox'; box.className = 'slip-lightbox';
    box.innerHTML = '<img id="slipLbImg" alt="สลิป" style="display:none"><div id="slipLbMsg" class="slip-lb-msg"></div><div class="slip-lb-close">แตะเพื่อปิด</div>';
    box.addEventListener('click', () => box.classList.remove('show'));
    document.body.appendChild(box);
  }
  const imgEl = document.getElementById('slipLbImg'), msg = document.getElementById('slipLbMsg');
  imgEl.style.display = 'none'; msg.style.display = 'block'; msg.textContent = '⏳ กำลังโหลดสลิป...';
  box.classList.add('show');
  try {
    const snap = await firebase.database().ref('rooms/' + activeRoom + '/slips/' + id).once('value');
    const v = snap.val();
    const src = (v && typeof v === 'object') ? v.img : v;
    if (src) { imgEl.src = src; imgEl.style.display = 'block'; msg.style.display = 'none'; }
    else { msg.textContent = 'ไม่พบรูปสลิป (อาจเป็นรายการเก่าก่อนเปิดฟีเจอร์เก็บสลิป)'; }
  } catch (e) { msg.textContent = 'โหลดสลิปไม่ได้: ' + (e.message || ''); }
}
async function send(preset){
  const text = preset || inputEl.value.trim();
  if(!text) return;
  inputEl.value = '';
  addMsg(text, 'user');
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.innerHTML = '<span></span><span></span><span></span>';
  chatEl.appendChild(typing);
  chatEl.scrollTop = chatEl.scrollHeight;

  let reply, viaAI = false;
  if(AI_PROXY && ready && window.firebase && firebase.auth){
    try { reply = await aiReply(text); viaAI = true; }
    catch(e){ reply = null; }
  }
  if(reply == null){
    await new Promise(r => setTimeout(r, 380));
    reply = botReply(text) + (AI_PROXY && !viaAI && ready ? '\n\n(⚡ โหมดสำรอง — เชื่อมต่อ AI ไม่ได้ชั่วคราว)' : '');
  }
  typing.remove();
  addMsg(reply, 'bot');
  chatHistory.push({ role: 'user', content: text }, { role: 'assistant', content: reply });
  if(chatHistory.length > 16) chatHistory.splice(0, chatHistory.length - 16);
}
(function renderQuick(){

    const b = document.createElement('button');

function setSync(on, text){
  document.getElementById('syncDot').className = 'dot' + (on ? ' on' : '');

}
function parseConfig(raw){
  raw = raw.trim();
  const i = raw.indexOf('{'), j = raw.lastIndexOf('}');
  if(i >= 0 && j > i) raw = raw.slice(i, j+1);
  try { return JSON.parse(raw); } catch(e){ try { return (new Function('return (' + raw + ')'))(); } catch(e2){ return null; } }
}
function activeConfig(){
  const rawCfg = localStorage.getItem(CFGKEY);
  if(rawCfg){ const c = parseConfig(rawCfg); if(c) return { cfg: c, room: localStorage.getItem(ROOMKEY) || BAKED_ROOM }; }
  if(BAKED_CONFIG && BAKED_CONFIG.apiKey) return { cfg: BAKED_CONFIG, room: BAKED_ROOM };
  return null;
}
function isAllowed(email){ return !!email && ALLOWED_EMAILS.map(e => e.toLowerCase()).includes(email.toLowerCase()); }
function showLogin(msg, email){
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginMsg').textContent = msg || 'เข้าสู่ระบบเพื่อใช้งาน';

function hideLogin(){ document.getElementById('loginScreen').style.display = 'none'; }
function googleSignIn(){
  // หน้านี้เปิดใน iframe ของแอปหลัก — ล็อกอินจริงทำที่หน้าหลัก (iOS: popup/redirect ในเฟรมใช้ไม่ได้)
  const inFrame = (function(){ try { return window.top !== window.self; } catch (e) { return true; } })();
  const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent||'') || (/Macintosh/.test(navigator.userAgent||'') && 'ontouchend' in document);
  if (inFrame || ios) {
    const el = document.getElementById('loginMsg');
    if (el) el.textContent = 'กรุณาล็อกอินที่หน้าหลักก่อนค่ะ\nปิดหน้านี้ (แตะแท็บ "หน้าแรก") → เข้าสู่ระบบ → แล้วกลับมาที่ผู้ช่วยอีกครั้ง';
    return;
  }
  const provider = new firebase.auth.GoogleAuthProvider();
  firebase.auth().signInWithPopup(provider).catch(err => {
    if(err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') return;
    if(err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment'){
      firebase.auth().signInWithRedirect(provider);
    } else {
      alert('เข้าสู่ระบบไม่สำเร็จ: ' + (err.message || err.code));
    }
  });
}
function googleSignOut(){ if(window.firebase && firebase.auth) firebase.auth().signOut().then(() => location.reload()); }

function connectRT(cfg, room){
  activeRoom = room;
  try { if(!app) app = firebase.initializeApp(cfg); } catch(e){}
  setSync(false, 'กำลังเชื่อมต่อ...');
  try {
    const db = firebase.database();
    db.ref('.info/connected').on('value', snap => {
      if(snap.val() === true) setSync(true, 'Real-time · ' + data.length + ' รายการ' + (AI_PROXY ? ' · AI ✨' : ''));
      else setSync(false, 'กำลังเชื่อมต่อ...');
    });
    db.ref('rooms/' + room + '/transfers').on('value', snap => {
      data = Object.values(snap.val() || {}).map(normalizeRec).filter(Boolean);
      const first = !ready;
      ready = true;
      setSync(true, 'Real-time · ' + data.length + ' รายการ' + (AI_PROXY ? ' · AI ✨' : ''));
      if(first) addMsg('สวัสดีค่ะ 🙏 น้องเฮิร์ต ผู้ช่วยร้าน HURT SHOP พร้อมแล้วค่ะ\nตอนนี้มี ' + data.length + ' รายการ ยอดคงเหลือสุทธิ ' + fmt(sum(data)) + ' ฿\nกดปุ่มด้านล่างหรือพิมพ์ถามได้เลยนะคะ', 'bot');
    }, err => {
      setSync(false, 'เชื่อมต่อไม่ได้');
      loadLocalFallback();
    });
    // คิวรออนุมัติ + เป้ายอด (อ่านอย่างเดียว — ถ้า rules ไม่เปิด path ไหนก็ข้ามเงียบๆ)
    db.ref('rooms/' + room + '/pending').on('value', snap => {
      pendingData = Object.values(snap.val() || {}).filter(x => x && typeof x === 'object' && x.id);
    }, () => { pendingData = []; });
    db.ref('rooms/' + room + '/meta/goal').on('value', snap => {
      const v = Number(snap.val()); if(isFinite(v) && v >= 0) goalAmt = v;
    }, () => {});
  } catch(e){
    setSync(false, 'config ไม่ถูกต้อง');
    loadLocalFallback();
  }
}
function loadLocalFallback(){
  try { data = (JSON.parse(localStorage.getItem(LKEY)) || []).map(normalizeRec).filter(Boolean); } catch(e){ data = []; }
  ready = true;
  setSync(false, 'โหมดออฟไลน์ · ' + data.length + ' รายการ');
  addMsg('⚠️ เชื่อมต่อฐานข้อมูลไม่ได้ ใช้ข้อมูลสำรองในเครื่องนี้แทน (' + data.length + ' รายการ)', 'bot');
}

/* ═══════════ boot ═══════════ */
try { const g = Number(localStorage.getItem('bank_goal_month')); if(isFinite(g) && g > 0) goalAmt = g; } catch(e) {}   // เป้าที่หน้าแรกจำไว้ (โดเมนเดียวกัน) — ใช้ก่อน/แทนค่าจาก Firebase
(function boot(){
  const ac = activeConfig();
  if(!ac){ hideLogin(); loadLocalFallback(); return; }
  try { if(!app) app = firebase.initializeApp(ac.cfg); } catch(e){}
  // เบี่ยง auth ผ่าน Worker authproxy เหมือน bank.html (เข้า googleapis ตรงช้ามากบนมือถือผู้ใช้)
  try {
    const d = firebase.auth()._delegate;
    if (d && d.config) {
      d.config.apiHost = 'authproxy.chitipat-kao.workers.dev/itk';
      d.config.tokenApiHost = 'authproxy.chitipat-kao.workers.dev/sts';
    }
  } catch (e) {}
  try { firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function(){}); } catch (e) {}
  showLogin('กำลังตรวจสอบ...');
  firebase.auth().onAuthStateChanged(user => {
    if(user && isAllowed(user.email)){
      currentUser = user;
      hideLogin();
      connectRT(ac.cfg, ac.room);
    } else if(user){
      showLogin('บัญชี ' + user.email + ' ไม่มีสิทธิ์เข้าถึงระบบนี้\nติดต่อเจ้าของระบบเพื่อขอสิทธิ์', user.email);
    } else {
      showLogin('เข้าสู่ระบบด้วย Google เพื่อใช้งาน');
    }
  });
})();
</script>
